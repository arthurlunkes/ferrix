name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Commands, requests and the relevant part of `ferrix.json` (remove tokens and passwords!).
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / error messages
      render: shell
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "Ferrix 0.1.0, Ubuntu 24.04, Rust 1.80, Node 20 / Docker image :full"

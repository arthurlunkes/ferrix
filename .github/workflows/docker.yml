name: Docker Images

on:
  push:
    branches:
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Multi-Arch Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU for multi-arch build
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------------------------
      # Core Image (Slim, default, ultra-enxuta ~20MB)
      # ------------------------------------------------------------------------
      - name: Extract metadata for Core image
        id: meta-core
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=slim,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{version}}-slim
            type=semver,pattern={{major}}.{{minor}}
            type=sha,enable=false

      - name: Build and push Core image (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: core
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-core.outputs.tags }}
          labels: ${{ steps.meta-core.outputs.labels }}
          cache-from: type=gha,scope=docker-core
          cache-to: type=gha,mode=max,scope=docker-core

      # ------------------------------------------------------------------------
      # Full Image (All-in-one with React Web Dashboard & Gateway)
      # ------------------------------------------------------------------------
      - name: Extract metadata for Full image
        id: meta-full
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=full,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}-full
            type=semver,pattern={{major}}.{{minor}}-full
            type=sha,enable=false

      - name: Build and push Full image (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: full
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-full.outputs.tags }}
          labels: ${{ steps.meta-full.outputs.labels }}
          cache-from: type=gha,scope=docker-full
          cache-to: type=gha,mode=max,scope=docker-full

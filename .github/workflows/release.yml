name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-version:
    name: Check Version & Tag Status
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
      tag_name: ${{ steps.check.outputs.tag_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version and existing tags
        id: check
        shell: bash
        run: |
          git fetch --tags --force

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG_NAME#v}"
            echo "Triggered directly by tag ${TAG_NAME}"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          VERSION=$(grep -m 1 '^version = ' Cargo.toml | cut -d '"' -f 2)
          TAG_NAME="v${VERSION}"
          echo "Cargo.toml version: ${VERSION} (tag: ${TAG_NAME})"

          if git rev-parse -q --verify "refs/tags/${TAG_NAME}" > /dev/null 2>&1; then
            echo "Tag ${TAG_NAME} already exists. Skipping release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Tag ${TAG_NAME} does not exist yet. Automatic release will proceed!"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          fi

  build-frontend:
    name: Build Frontend UI
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend distribution
        working-directory: frontend
        run: npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

  build-binaries:
    name: Build Binary (${{ matrix.target }})
    needs: [check-version, build-frontend]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
          - target: x86_64-apple-darwin
            os: macos-14
            use_cross: false
          - target: aarch64-apple-darwin
            os: macos-14
            use_cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Install Cross for cross-compilation
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build Ferrix binary (Native)
        if: "!matrix.use_cross"
        run: cargo build --release --target ${{ matrix.target }} --workspace

      - name: Build Ferrix binary (Cross)
        if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }} --workspace

      - name: Package Archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          TAG="${{ needs.check-version.outputs.tag_name }}"
          ARCHIVE_NAME="ferrix-${TAG}-${{ matrix.target }}"
          DIR_NAME="/tmp/${ARCHIVE_NAME}"
          mkdir -p "${DIR_NAME}/ui"
          cp "target/${{ matrix.target }}/release/ferrix" "${DIR_NAME}/"
          cp README.md LICENSE "${DIR_NAME}/"
          [ -f ferrix.example.yaml ] && cp ferrix.example.yaml "${DIR_NAME}/" || true
          [ -f ferrix.yaml ] && cp ferrix.yaml "${DIR_NAME}/" || true
          cp -r frontend/dist/* "${DIR_NAME}/ui/"
          tar -czvf "${ARCHIVE_NAME}.tar.gz" -C /tmp "${ARCHIVE_NAME}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${ARCHIVE_NAME}.tar.gz" > "${ARCHIVE_NAME}.tar.gz.sha256"
          else
            shasum -a 256 "${ARCHIVE_NAME}.tar.gz" > "${ARCHIVE_NAME}.tar.gz.sha256"
          fi

      - name: Package Archive (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          TAG="${{ needs.check-version.outputs.tag_name }}"
          ARCHIVE_NAME="ferrix-${TAG}-${{ matrix.target }}"
          DIR_NAME="${ARCHIVE_NAME}"
          mkdir -p "${DIR_NAME}/ui"
          cp "target/${{ matrix.target }}/release/ferrix.exe" "${DIR_NAME}/"
          cp README.md LICENSE "${DIR_NAME}/"
          [ -f ferrix.example.yaml ] && cp ferrix.example.yaml "${DIR_NAME}/" || true
          [ -f ferrix.yaml ] && cp ferrix.yaml "${DIR_NAME}/" || true
          cp -r frontend/dist/* "${DIR_NAME}/ui/"
          7z a "${ARCHIVE_NAME}.zip" "${DIR_NAME}"
          certutil -hashfile "${ARCHIVE_NAME}.zip" SHA256 | grep -v "hash" | tr -d ' \r\n' > "${ARCHIVE_NAME}.zip.sha256"

      - name: Upload Release Archive
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: |
            ferrix-*.tar.gz
            ferrix-*.tar.gz.sha256
            ferrix-*.zip
            ferrix-*.zip.sha256

  publish-release:
    name: Publish GitHub Release
    needs: [check-version, build-binaries]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: release_assets

      - name: Display release assets
        run: ls -la release_assets/

      - name: Create GitHub Release & Tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-version.outputs.tag_name }}
          name: Ferrix ${{ needs.check-version.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          files: release_assets/*
          generate_release_notes: true
          draft: false
          prerelease: false

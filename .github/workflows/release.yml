name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-version:
    name: Check Version & Tag Status
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
      tag_name: ${{ steps.check.outputs.tag_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version and existing tags
        id: check
        shell: bash
        run: |
          git fetch --tags --force

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG_NAME#v}"
            echo "Triggered directly by tag ${TAG_NAME}"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          VERSION=$(grep -m 1 '^version = ' Cargo.toml | cut -d '"' -f 2)
          TAG_NAME="v${VERSION}"
          echo "Cargo.toml version: ${VERSION} (tag: ${TAG_NAME})"

          if git rev-parse -q --verify "refs/tags/${TAG_NAME}" > /dev/null 2>&1; then
            echo "Tag ${TAG_NAME} already exists. Skipping release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Tag ${TAG_NAME} does not exist yet. Automatic release will proceed!"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          fi

  build-frontend:
    name: Build Frontend UI
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend distribution
        working-directory: frontend
        run: npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

  build-binaries:
    name: Build Binary (${{ matrix.target }})
    needs: [check-version, build-frontend]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux binaries are static (musl): one build runs on any distribution,
          # whatever its glibc version, and goes into the deb/rpm/Arch packages.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
          - target: x86_64-apple-darwin
            os: macos-14
            use_cross: false
          - target: aarch64-apple-darwin
            os: macos-14
            use_cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Install Cross for cross-compilation
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build Ferrix binary (Native)
        if: "!matrix.use_cross"
        run: cargo build --release --target ${{ matrix.target }} --workspace

      - name: Build Ferrix binary (Cross)
        if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }} --workspace

      - name: Package Archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          TAG="${{ needs.check-version.outputs.tag_name }}"
          ARCHIVE_NAME="ferrix-${TAG}-${{ matrix.target }}"
          DIR_NAME="/tmp/${ARCHIVE_NAME}"
          mkdir -p "${DIR_NAME}/ui"
          cp "target/${{ matrix.target }}/release/ferrix" "${DIR_NAME}/"
          cp README.md LICENSE "${DIR_NAME}/"
          [ -f ferrix.example.yaml ] && cp ferrix.example.yaml "${DIR_NAME}/" || true
          [ -f ferrix.yaml ] && cp ferrix.yaml "${DIR_NAME}/" || true
          cp -r frontend/dist/* "${DIR_NAME}/ui/"
          tar -czvf "${ARCHIVE_NAME}.tar.gz" -C /tmp "${ARCHIVE_NAME}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${ARCHIVE_NAME}.tar.gz" > "${ARCHIVE_NAME}.tar.gz.sha256"
          else
            shasum -a 256 "${ARCHIVE_NAME}.tar.gz" > "${ARCHIVE_NAME}.tar.gz.sha256"
          fi

      - name: Package Archive (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          TAG="${{ needs.check-version.outputs.tag_name }}"
          ARCHIVE_NAME="ferrix-${TAG}-${{ matrix.target }}"
          DIR_NAME="${ARCHIVE_NAME}"
          mkdir -p "${DIR_NAME}/ui"
          cp "target/${{ matrix.target }}/release/ferrix.exe" "${DIR_NAME}/"
          cp README.md LICENSE "${DIR_NAME}/"
          [ -f ferrix.example.yaml ] && cp ferrix.example.yaml "${DIR_NAME}/" || true
          [ -f ferrix.yaml ] && cp ferrix.yaml "${DIR_NAME}/" || true
          cp -r frontend/dist/* "${DIR_NAME}/ui/"
          7z a "${ARCHIVE_NAME}.zip" "${DIR_NAME}"
          certutil -hashfile "${ARCHIVE_NAME}.zip" SHA256 | grep -v "hash" | tr -d ' \r\n' > "${ARCHIVE_NAME}.zip.sha256"

      - name: Upload Release Archive
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: |
            ferrix-*.tar.gz
            ferrix-*.tar.gz.sha256
            ferrix-*.zip
            ferrix-*.zip.sha256

  linux-packages:
    name: Linux packages (deb, rpm, Arch)
    needs: [check-version, build-binaries]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download the Linux archives
        uses: actions/download-artifact@v4
        with:
          pattern: package-*-linux-musl
          merge-multiple: true
          path: archives

      - name: Install nfpm
        run: |
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq nfpm

      - name: Build the packages
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            printf '%s\n' "$SIGNING_KEY" > "$RUNNER_TEMP/signing.asc"
            export NFPM_SIGNING_KEY_FILE="$RUNNER_TEMP/signing.asc"
          fi
          VERSION="${{ needs.check-version.outputs.version }}"
          TAG="${{ needs.check-version.outputs.tag_name }}"
          mkdir -p dist
          for pair in amd64:x86_64-unknown-linux-musl arm64:aarch64-unknown-linux-musl; do
            ARCH="${pair%%:*}"; TRIPLE="${pair#*:}"
            rm -rf packaging/build && mkdir -p packaging/build
            tar -xzf "archives/ferrix-${TAG}-${TRIPLE}.tar.gz" -C packaging/build
            mv "packaging/build/ferrix-${TAG}-${TRIPLE}/ferrix" packaging/build/ferrix
            mv "packaging/build/ferrix-${TAG}-${TRIPLE}/ui" packaging/build/dashboard
            for packager in deb rpm archlinux; do
              VERSION="$VERSION" ARCH="$ARCH" nfpm package --config packaging/nfpm.yaml --packager "$packager" --target dist/
            done
          done
          rm -f "$RUNNER_TEMP/signing.asc"
          ls -la dist/

      - name: Upload the packages
        uses: actions/upload-artifact@v4
        with:
          name: package-linux-native
          path: dist/*

  publish-release:
    name: Publish GitHub Release
    needs: [check-version, build-binaries, linux-packages]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: release_assets

      - name: Write SHA256SUMS
        working-directory: release_assets
        run: |
          rm -f ./*.sha256
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release & Tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-version.outputs.tag_name }}
          name: Ferrix ${{ needs.check-version.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          files: release_assets/*
          generate_release_notes: true
          draft: false
          prerelease: false

  update-manifests:
    name: Update Homebrew and Scoop manifests
    needs: [check-version, publish-release]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Write the manifests for this release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.check-version.outputs.tag_name }}"
          gh release download "$TAG" --repo "${{ github.repository }}" --pattern SHA256SUMS --dir "$RUNNER_TEMP"
          python3 packaging/update_manifests.py "${{ needs.check-version.outputs.version }}" "$RUNNER_TEMP/SHA256SUMS"

      - name: Commit them
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/ferrix.rb packaging/scoop/ferrix.json
          if git diff --cached --quiet; then
            echo "Manifests already up to date."
            exit 0
          fi
          git commit -m "chore: Homebrew and Scoop manifests for ${{ needs.check-version.outputs.tag_name }}"
          git push origin HEAD:main

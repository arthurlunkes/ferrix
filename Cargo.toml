[workspace]
members = [
    "core"
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Arthur Lunkes"]
license = "Apache-2.0"
repository = "https://github.com/arthurlunkes/ferrix"
homepage = "https://arthurlunkes.github.io/ferrix"
documentation = "https://arthurlunkes.github.io/ferrix"
readme = "README.md"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

# Code that only runs at startup, on config changes or in the admin API is compiled for
# size: it stays mapped in every running server, but speed doesn't matter there. The
# request path (tokio, hyper, rustls, ring, Ferrix itself) keeps the default opt-level.
[profile.release.package.serde-saphyr]
opt-level = "z"
[profile.release.package.granit-parser]
opt-level = "z"
[profile.release.package.annotate-snippets]
opt-level = "z"
[profile.release.package.serde_json]
opt-level = "z"
[profile.release.package.instant-acme]
opt-level = "z"
[profile.release.package.x509-parser]
opt-level = "z"

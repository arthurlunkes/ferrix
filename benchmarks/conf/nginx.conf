# nginx sob teste: 4 workers, sendfile e keepalive com o upstream — uma configuração
# de produção razoável, não um nginx propositalmente fraco.
worker_processes 4;
events { worker_connections 4096; }
http {
    access_log off;
    sendfile on;
    tcp_nopush on;
    keepalive_requests 100000;
    upstream be { server 127.0.0.1:9100; keepalive 64; }
    server {
        listen 9002;
        root /www;
        location /proxy/ {
            proxy_pass http://be/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}

# Backend usado pelos dois proxies: responde 20 bytes fixos, o mais rápido possível,
# para que o gargalo medido seja o proxy e não o backend.
worker_processes 4;
events { worker_connections 4096; }
http {
    access_log off;
    keepalive_requests 100000;
    server { listen 9100; location / { return 200 "hello from upstream\n"; } }
}

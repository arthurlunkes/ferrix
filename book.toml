[book]
authors = ["Arthur Lunkes"]
language = "pt-BR"
multilingual = false
src = "docs"
title = "Ferrix — Documentação Oficial"

[output.html]
git-repository-url = "https://github.com/arthurlunkes/ferrix"
edit-url-template = "https://github.com/arthurlunkes/ferrix/edit/main/{path}"
default-theme = "coal"
preferred-dark-theme = "coal"
site-url = "/ferrix/"

[output.html.search]
enable = true
limit-results = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3
copy-js = true


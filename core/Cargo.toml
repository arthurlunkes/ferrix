[package]
name = "ferrix"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
description = "High-performance standalone Nginx clone in Rust (Proxy Engine & Control Plane)"

[dependencies]
tokio = { version = "1", features = ["full"] }
# Only axum's core types and its WebSocket upgrade are used (no Router/extractors).
axum = { version = "0.8", default-features = false, features = ["ws", "tokio", "http1"] }
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1"] }
http-body-util = "0.1"
http-body = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-saphyr = "=1.3.0"
arc-swap = "1.7"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
mime_guess = "2.0"
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["io"] }
regex-lite = "0.1"
uuid = { version = "1.10", features = ["v4", "fast-rng", "serde"] }
base64 = "0.22"
tokio-tungstenite = "0.29"
url = "2.5"
ipnet = { version = "2.10", features = ["serde"] }
libc = "0.2"
socket2 = { version = "0.6", features = ["all"] }
rustls-pemfile = "2"
rustls = { version = "0.23", features = ["ring"] }
mimalloc = { version = "0.1", default-features = false }
libmimalloc-sys = { version = "0.1", default-features = false, features = ["extended"] }
bytes = "1"
httparse = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
async-compression = { version = "0.4", features = ["tokio", "gzip"] }
instant-acme = { version = "0.8", default-features = false, features = ["hyper-rustls", "ring", "rcgen"], optional = true }
x509-parser = { version = "0.18", optional = true }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"], optional = true }
h3 = { version = "0.0.8", optional = true }
h3-quinn = { version = "0.0.10", optional = true }

# Optional modules, like nginx's `--with-*` build options. All are on by default; a
# minimal build (`cargo build --release --no-default-features`) leaves them out and
# keeps less code resident in every running server.
[features]
default = ["http2", "http3", "brotli", "zstd", "acme", "admin", "nginx-import"]
# HTTP/2 for clients (h2c and over TLS via ALPN).
http2 = ["hyper/http2", "hyper-util/http2", "hyper-util/server-auto"]
# HTTP/3 (QUIC) for clients on TLS ports; still only served when `http.protocols`
# lists `http3`.
http3 = ["dep:quinn", "dep:h3", "dep:h3-quinn"]
# Brotli and zstd response compression (gzip is always available).
brotli = ["async-compression/brotli"]
zstd = ["async-compression/zstd"]
# Automatic Let's Encrypt certificates (`tls.acme`).
acme = ["dep:instant-acme", "dep:x509-parser"]
# Control-plane REST API, live log stream and the web dashboard (`admin:`).
admin = []
# `ferrix import` and the dashboard's "Import nginx" page.
nginx-import = []


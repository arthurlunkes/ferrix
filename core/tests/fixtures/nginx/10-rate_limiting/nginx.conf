##############################################################################
# RATE LIMITING E PROTECAO
#
# O NGINX usa "leaky bucket": a taxa nao e uma cota por segundo, e um INTERVALO
# MINIMO entre requisicoes. `rate=5r/s` significa "uma a cada 200ms", nao
# "cinco de uma vez a cada segundo" - mandar 5 juntas rejeita 4.
#
# O `burst` e o que torna isso utilizavel na pratica: e o tamanho da fila que
# absorve rajadas. E o `nodelay` decide se a fila ATRASA ou LIBERA na hora.
##############################################################################

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format limites '$remote_addr [$time_local] "$request" status=$status '
                       'rt=$request_time';
    access_log /var/log/nginx/access.log limites;
    error_log  /var/log/nginx/error.log notice;

    # ------------------------------------------------------------------------
    # QUEM ESTA ISENTO
    #
    # `geo` classifica o IP de origem; o `map` transforma isso na chave do
    # limite. Chave VAZIA = sem limite (o NGINX ignora limites com chave vazia).
    # E o mesmo mecanismo que, por descuido, desliga a protecao inteira - aqui
    # ele e usado de proposito.
    # ------------------------------------------------------------------------
    geo $ip_isento {
        default        0;
        127.0.0.1      1;
        172.30.0.0/16  0;   # a rede do compose NAO e isenta, senao nada limita
    }

    map $ip_isento $chave_limite {
        1  "";                      # isento: sem chave, sem limite
        0  $binary_remote_addr;     # sujeito ao limite, chaveado por IP
    }

    # ------------------------------------------------------------------------
    # AS ZONAS
    #
    # $binary_remote_addr e nao $remote_addr: a forma binaria ocupa 4 bytes
    # (IPv4) em vez dos ~15 do texto. Em 10m cabem ~160 mil IPs.
    #
    # A zona guarda o ESTADO do limite e e compartilhada entre os workers.
    # Cuidado ao mexer: trocar a chave de uma zona nao tem efeito com
    # `nginx -s reload` - so recriando o container.
    # ------------------------------------------------------------------------
    # Uma zona por modo, de proposito: zonas compartilhadas somam o consumo de
    # TODAS as locations que as usam. Aqui isso atrapalharia (testar /burst
    # gastaria a cota de /burst-nodelay), mas em producao e justamente como se
    # faz uma cota global valendo para varios endpoints de uma vez.
    limit_req_zone  $chave_limite zone=basico:10m         rate=5r/s;
    limit_req_zone  $chave_limite zone=rajada_fila:10m    rate=5r/s;
    limit_req_zone  $chave_limite zone=rajada_nodelay:10m rate=5r/s;
    limit_req_zone  $chave_limite zone=rajada_delay:10m   rate=5r/s;
    limit_conn_zone $chave_limite zone=conexoes:10m;

    # 429 (Too Many Requests) diz a verdade ao cliente. O padrao do NGINX e
    # 503, que sugere "servidor com problema" - e faz cliente e monitoramento
    # tratarem o caso errado.
    limit_req_status  429;
    limit_conn_status 429;
    limit_req_log_level warn;

    upstream backend {
        server app:3000;
        keepalive 16;
    }

    server {
        listen 80;
        server_name localhost;

        # ====================================================================
        # 1. SEM LIMITE - referencia para comparar
        # ====================================================================
        location /sem-limite {
            proxy_pass http://backend/;
            include /etc/nginx/snippets/proxy.conf;
        }

        # ====================================================================
        # 2. ESTRITO - rate=5r/s, sem burst
        #
        # Uma a cada 200ms, e ponto. Qualquer coisa que chegue antes leva 429.
        # Na pratica quase nunca e o que se quer: navegadores abrem varias
        # conexoes de uma vez e tomariam 429 em pagina normal.
        # ====================================================================
        location /estrito {
            limit_req zone=basico;
            proxy_pass http://backend/;
            include /etc/nginx/snippets/proxy.conf;
        }

        # ====================================================================
        # 3. BURST COM FILA (sem nodelay)
        #
        # Ate 10 excedentes entram numa fila e sao liberados no ritmo de 5r/s.
        # Ninguem toma 429 enquanto couber na fila - mas ESPERA. A 11a request
        # de uma rajada sai ~2s depois. Bom para proteger o backend, ruim para
        # a percepcao de latencia do usuario.
        # ====================================================================
        location /burst {
            limit_req zone=rajada_fila burst=10;
            proxy_pass http://backend/;
            include /etc/nginx/snippets/proxy.conf;
        }

        # ====================================================================
        # 4. BURST SEM FILA (nodelay) - o mais usado
        #
        # Mesma fila de 10, mas todas passam IMEDIATAMENTE; a fila apenas
        # continua drenando a 5r/s para liberar espaco. Rajada curta passa
        # rapido, abuso sustentado toma 429. Esta e a configuracao que se quer
        # na maioria das APIs.
        # ====================================================================
        location /burst-nodelay {
            limit_req zone=rajada_nodelay burst=10 nodelay;
            proxy_pass http://backend/;
            include /etc/nginx/snippets/proxy.conf;
        }

        # ====================================================================
        # 5. MEIO-TERMO (delay=N)
        #
        # As 5 primeiras da fila passam na hora; da 6a a 10a esperam; acima
        # disso, 429. Serve quando se quer absorver a rajada normal sem
        # atraso, mas ainda frear quem passa do ponto.
        # ====================================================================
        location /burst-delay {
            limit_req zone=rajada_delay burst=10 delay=5;
            proxy_pass http://backend/;
            include /etc/nginx/snippets/proxy.conf;
        }

        # ====================================================================
        # 6. LIMITE DE CONEXOES SIMULTANEAS
        #
        # limit_conn conta CONEXOES abertas ao mesmo tempo, nao requisicoes por
        # segundo. E a defesa contra download lento / slowloris, onde o
        # atacante faz poucas requisicoes mas as segura abertas.
        #
        # Teste com /conexoes?ms=3000 em paralelo.
        # ====================================================================
        location /conexoes {
            limit_conn conexoes 2;
            proxy_pass http://backend/;
            include /etc/nginx/snippets/proxy.conf;
        }

        # ====================================================================
        # 7. RESPOSTA DE ERRO CUSTOMIZADA
        # ====================================================================
        error_page 429 = @limite_atingido;

        location @limite_atingido {
            default_type application/json;
            # Retry-After diz ao cliente QUANDO voltar - sem ele, um cliente
            # bem-comportado nao tem como saber e costuma repetir na hora.
            add_header Retry-After 1 always;
            return 429 '{"erro":"limite excedido","tente_em_segundos":1}\n';
        }
    }
}

##############################################################################
# CACHE DE CONTEUDO (proxy_cache)
#
# O backend deste exemplo demora 500ms de proposito e devolve um contador. Se o
# contador nao muda entre duas requisicoes, a segunda nunca chegou ao backend.
#
# Todo location expoe o header X-Cache-Status, que e $upstream_cache_status:
#   MISS        nao estava no cache; foi buscar e guardou
#   HIT         serviu do cache, sem tocar no backend
#   EXPIRED     estava no cache, mas vencido; foi buscar de novo
#   STALE       backend indisponivel; serviu a copia vencida assim mesmo
#   UPDATING    serviu a copia vencida enquanto outra request a renova
#   BYPASS      instruido a ignorar o cache nesta requisicao
#   REVALIDATED perguntou ao backend e ele respondeu 304 Not Modified
##############################################################################

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format cache '$remote_addr "$request" status=$status '
                     'cache=$upstream_cache_status rt=$request_time';
    access_log /var/log/nginx/access.log cache;
    error_log  /var/log/nginx/error.log warn;

    # ------------------------------------------------------------------------
    # O ARMAZENAMENTO
    #
    # levels=1:2   subdiretorios a partir do hash (a/bc/...). Sem isso, milhoes
    #              de arquivos num diretorio so deixam o filesystem lento.
    # keys_zone    memoria para as CHAVES e metadados (o corpo fica em disco).
    #              1m guarda ~8 mil chaves.
    # max_size     teto do disco; ao estourar, o cache manager remove os menos
    #              usados recentemente.
    # inactive     remove o que ninguem pediu nesse periodo, MESMO que ainda
    #              esteja valido. E diferente de proxy_cache_valid, e a confusao
    #              entre os dois e classica.
    # use_temp_path=off  escreve direto no destino, evitando copia entre
    #              filesystems.
    # ------------------------------------------------------------------------
    proxy_cache_path /var/cache/nginx/conteudo
                     levels=1:2
                     keys_zone=conteudo:10m
                     max_size=500m
                     inactive=10m
                     use_temp_path=off;

    # ------------------------------------------------------------------------
    # A CHAVE DO CACHE
    #
    # O padrao e "$scheme$proxy_host$request_uri" - repare no que NAO esta ali:
    # nenhum cookie, nenhum header de autenticacao. Cachear uma pagina que
    # depende de login com a chave padrao entrega a pagina de um usuario para
    # outro. E o incidente de seguranca mais comum envolvendo cache.
    #
    # Aqui o $http_accept_encoding entra na chave para nao servir um corpo
    # comprimido a um cliente que nao aceita compressao.
    # ------------------------------------------------------------------------
    proxy_cache_key "$scheme$request_method$host$request_uri$http_accept_encoding";

    # Deixa visivel de fora o que aconteceu. Vale manter em producao.
    add_header X-Cache-Status $upstream_cache_status always;

    upstream backend {
        server app:3000;
        keepalive 16;
    }

    # ------------------------------------------------------------------------
    # A BARRA FINAL DO proxy_pass
    #
    # `proxy_pass http://backend;`  (SEM URI) repassa a URI original intacta:
    #     /cache/x  ->  /cache/x
    #
    # `proxy_pass http://backend/;` (COM URI) troca o prefixo casado no
    # location pela URI informada:
    #     location /cache  +  proxy_pass .../   =>  /cache/x  ->  //x
    #
    # Repare no "//": com `location /cache` (sem barra) o prefixo removido e
    # "/cache", sobra "/x", e a barra do proxy_pass vira "//x". Isso quebra
    # backends que constroem URLs a partir do caminho recebido.
    #
    # Regra pratica: ou os dois com barra (`location /cache/` +
    # `proxy_pass .../`), ou proxy_pass sem URI nenhuma. Misturar e a origem de
    # metade dos 404 inexplicaveis em proxy reverso.
    # ------------------------------------------------------------------------

    server {
        listen 80;
        server_name localhost;

        # ====================================================================
        # 1. SEM CACHE - referencia (cada request custa 500ms)
        # ====================================================================
        location /sem-cache {
            proxy_pass http://backend;
            include /etc/nginx/snippets/proxy.conf;
        }

        # ====================================================================
        # 2. CACHE BASICO
        #
        # A primeira request e MISS e demora 500ms; as seguintes sao HIT e
        # respondem em ~1ms sem tocar no backend.
        # ====================================================================
        location /cache {
            proxy_cache conteudo;

            # Tempo de validade POR STATUS. Cachear erros por pouco tempo evita
            # que uma falha momentanea vire uma tempestade de requests no
            # backend - e evita gravar o erro por muito tempo.
            proxy_cache_valid 200 30s;
            proxy_cache_valid 404 10s;
            proxy_cache_valid any 5s;

            # Junta requests simultaneas do mesmo recurso numa so: a primeira
            # busca no backend e as outras esperam o resultado. Sem isso, 100
            # clientes pedindo algo que acabou de expirar geram 100 requests
            # simultaneas ao backend (thundering herd / cache stampede).
            proxy_cache_lock on;
            proxy_cache_lock_timeout 5s;

            proxy_pass http://backend;
            include /etc/nginx/snippets/proxy.conf;
        }

        # ====================================================================
        # 3. O BACKEND MANDA NAO CACHEAR
        #
        # Cache-Control: no-store vindo do backend faz o NGINX nao guardar.
        # X-Cache-Status vem MISS toda vez - MISS aqui nao significa "vai
        # guardar", significa "nao veio do cache".
        # ====================================================================
        location /privado {
            proxy_cache conteudo;
            proxy_cache_valid 200 30s;
            proxy_pass http://backend/privado;
            include /etc/nginx/snippets/proxy.conf;
        }

        # ====================================================================
        # 4. IGNORANDO O QUE O BACKEND PEDIU
        #
        # Aqui esta a resposta para "configurei proxy_cache e nada e cacheado":
        # normalmente e um Set-Cookie ou um Cache-Control do backend.
        # proxy_ignore_headers manda o NGINX desconsiderar.
        #
        # Perigoso: se o Set-Cookie era de sessao, o NGINX vai guardar o cookie
        # de um usuario e entregar para os outros. So use em conteudo que voce
        # tem certeza que e publico.
        # ====================================================================
        location /ignora-headers {
            proxy_cache conteudo;
            proxy_cache_valid 200 30s;
            proxy_ignore_headers Cache-Control Expires Set-Cookie;

            # Nao repassa o Set-Cookie ao cliente - se vai cachear, o cookie
            # nao pode vazar junto.
            proxy_hide_header Set-Cookie;

            proxy_pass http://backend/com-cookie;
            include /etc/nginx/snippets/proxy.conf;
        }

        # ====================================================================
        # 5. SOBREVIVER AO BACKEND CAINDO  <- o recurso mais valioso daqui
        #
        # use_stale manda servir a copia vencida quando o backend nao responde.
        # O site continua de pe com conteudo levemente velho, em vez de exibir
        # 502 para todo mundo.
        #
        # updating + background_update: quando a copia vence, o visitante
        # recebe a versao velha NA HORA e o NGINX renova por baixo dos panos.
        # Ninguem paga os 500ms da revalidacao.
        # ====================================================================
        location /stale {
            proxy_cache conteudo;
            proxy_cache_valid 200 5s;

            proxy_cache_use_stale error timeout updating
                                  http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            proxy_cache_lock on;

            proxy_pass http://backend;
            include /etc/nginx/snippets/proxy.conf;
        }

        # ====================================================================
        # 6. INVALIDACAO SOB DEMANDA
        #
        # `proxy_cache_purge` e do NGINX Plus. No open-source o equivalente e
        # proxy_cache_bypass: a requisicao ignora o cache, vai ao backend e
        # SOBRESCREVE a entrada da mesma chave. Na pratica, um purge.
        #
        #   curl localhost:8080/purgavel/                       -> HIT (velho)
        #   curl -H "X-Purge-Cache: 1" localhost:8080/purgavel/ -> BYPASS
        #   curl localhost:8080/purgavel/                       -> HIT (novo)
        #
        # >>> O GATILHO PRECISA FICAR FORA DA CHAVE DO CACHE <<<
        #
        # A tentacao e usar um parametro de query (`proxy_cache_bypass
        # $arg_renovar` + `?renovar=1`). Nao funciona como purge: a chave deste
        # exemplo inclui $request_uri, entao "/purgavel/?renovar=1" e uma chave
        # DIFERENTE de "/purgavel/". O bypass busca no backend e grava... na
        # entrada errada. A original continua velha, intacta.
        #
        # Por isso o gatilho aqui e um HEADER: headers nao entram na chave, a
        # requisicao grava exatamente na entrada que se quer renovar.
        #
        # Em producao, proteja por IP ou token - senao qualquer um derruba seu
        # cache mandando o header em toda requisicao.
        # ====================================================================
        location /purgavel {
            proxy_cache conteudo;
            proxy_cache_valid 200 5m;

            proxy_cache_bypass $http_x_purge_cache;

            proxy_pass http://backend;
            include /etc/nginx/snippets/proxy.conf;
        }

        # ====================================================================
        # 7. NAO CACHEAR QUEM ESTA LOGADO
        #
        # A regra pratica que evita o vazamento descrito la em cima: se existe
        # cookie de sessao, nem le nem grava no cache.
        # ====================================================================
        location /por-sessao {
            proxy_cache conteudo;
            proxy_cache_valid 200 30s;

            proxy_cache_bypass $cookie_sessao;   # nao LE do cache
            proxy_no_cache     $cookie_sessao;   # nao GRAVA no cache

            proxy_pass http://backend;
            include /etc/nginx/snippets/proxy.conf;
        }
    }
}

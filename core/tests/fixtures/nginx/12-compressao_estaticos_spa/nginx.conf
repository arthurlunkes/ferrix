##############################################################################
# COMPRESSAO, ESTATICOS E SPA
#
# Tres assuntos que andam juntos porque atacam o mesmo problema: entregar uma
# aplicacao de frontend rapido e sem quebrar ao recarregar a pagina.
##############################################################################

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format estaticos '"$request" status=$status bytes=$body_bytes_sent '
                         'gzip=$gzip_ratio';
    access_log /var/log/nginx/access.log estaticos;
    error_log  /var/log/nginx/error.log warn;

    # ------------------------------------------------------------------------
    # ENTREGA DE ARQUIVOS
    #
    # sendfile: copia do disco para o socket dentro do kernel, sem passar os
    #   bytes pelo processo do NGINX.
    # tcp_nopush: junta os headers com o inicio do corpo no mesmo pacote (so
    #   faz efeito com sendfile ligado).
    # tcp_nodelay: desliga o algoritmo de Nagle nas conexoes keep-alive, para
    #   respostas pequenas nao esperarem para "encher" um pacote.
    # ------------------------------------------------------------------------
    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;

    # Mantem descritores de arquivo abertos em cache. Em site estatico com
    # muitos acessos, elimina um open()/stat() por requisicao.
    open_file_cache          max=1000 inactive=20s;
    open_file_cache_valid    30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors   on;

    # ------------------------------------------------------------------------
    # COMPRESSAO
    # ------------------------------------------------------------------------
    gzip on;

    # Abaixo disto nao compensa: o overhead do header gzip e a CPU gasta
    # superam a economia, e pacotes pequenos ja cabem num segmento TCP.
    gzip_min_length 256;

    # 1 a 9. Acima de 6 o ganho de tamanho e marginal e o custo de CPU sobe
    # rapido. 5-6 e o ponto de equilibrio usado na pratica.
    gzip_comp_level 6;

    # SEM ISTO SE SERVE CONTEUDO ERRADO: adiciona "Vary: Accept-Encoding",
    # avisando caches intermediarios de que a resposta MUDA conforme o cliente
    # aceitar ou nao gzip. Sem o Vary, um proxy guarda a versao comprimida e a
    # entrega a um cliente que nao sabe descomprimir.
    gzip_vary on;

    # Por padrao o NGINX nao comprime resposta que veio de proxy. `any` liga
    # para todas - relevante nos exemplos que usam proxy_pass.
    gzip_proxied any;

    # text/html ja e comprimido sempre e nao pode ser listado aqui.
    # Nao adianta listar jpeg/png/woff2/zip: ja sao formatos comprimidos, e
    # recomprimir so gasta CPU para economizar quase nada.
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ------------------------------------------------------------------------
    # ARQUIVOS PRE-COMPRIMIDOS
    #
    # Se existir "app.js.gz" ao lado de "app.js", serve o .gz pronto em vez de
    # comprimir a cada requisicao. Comprimir uma vez no build e melhor que
    # comprimir a cada acesso - e permite usar comp_level 9 sem custo em
    # runtime.
    # ------------------------------------------------------------------------
    gzip_static on;

    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        # ====================================================================
        # 1. ASSETS COM HASH NO NOME - cache agressivo
        #
        # "immutable" diz ao navegador para nao revalidar NEM com F5. So e
        # seguro porque o nome do arquivo contem um hash do conteudo: mudou o
        # conteudo, muda o nome, e o cache antigo simplesmente deixa de ser
        # pedido.
        #
        # Aplicar isto em arquivo SEM hash no nome deixa usuarios presos numa
        # versao antiga por um ano.
        # ====================================================================
        location /assets/ {
            # Apenas UM dos dois - `expires 1y` e `add_header Cache-Control`
            # nao se substituem, se SOMAM: usar os dois manda o header
            # duplicado ("max-age=31536000" e depois o outro), e o cliente
            # decide qual obedecer. Como se quer o "immutable", que o `expires`
            # nao sabe emitir, fica so o add_header.
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            access_log off;

            # >>> A ARMADILHA MAIS COMUM DE SPA <<<
            #
            # Aqui NAO tem fallback para index.html, de proposito. Se tivesse,
            # um arquivo .js que nao existe devolveria o HTML da pagina com
            # status 200, e o navegador tentaria executar "<!DOCTYPE html>"
            # como JavaScript - o famoso "Unexpected token '<'". O 404 aqui e
            # o comportamento correto.
            try_files $uri =404;
        }

        # ====================================================================
        # 2. ROTAS DA SPA
        #
        # try_files tenta o arquivo, depois o diretorio, e por fim entrega o
        # index.html. E o que faz F5 em /painel/relatorios funcionar: o
        # servidor devolve o shell da aplicacao e o roteador do frontend
        # assume dali.
        # ====================================================================
        location / {
            # O shell nao pode ser cacheado como os assets: e ele que aponta
            # para os nomes novos dos arquivos com hash. Cacheado, o usuario
            # continuaria carregando a versao antiga.
            add_header Cache-Control "no-cache";

            try_files $uri $uri/ /index.html;
        }

        # ====================================================================
        # 3. COMPARACAO - a mesma pasta, sem compressao
        # ====================================================================
        location /sem-gzip/ {
            gzip off;
            gzip_static off;
            alias /usr/share/nginx/html/assets/;
            try_files $uri =404;
        }

        # ====================================================================
        # 4. PAGINAS DE ERRO
        #
        # `internal` impede que alguem acesse /404.html direto e receba 200 -
        # o que confunde crawlers e monitoramento.
        # ====================================================================
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;

        location = /404.html { internal; }
        location = /50x.html { internal; }

        # Mostra o que o NGINX decidiu sobre esta requisicao.
        location = /_debug {
            default_type text/plain;
            return 200 "uri=$uri gzip_ratio=$gzip_ratio accept_encoding=$http_accept_encoding\n";
        }
    }
}

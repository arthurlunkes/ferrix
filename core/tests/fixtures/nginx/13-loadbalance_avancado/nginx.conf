##############################################################################
# LOAD BALANCING AVANCADO E FAILOVER
#
# O exemplo 2 mostrou o round robin. Aqui estao os outros algoritmos, o que
# acontece quando uma instancia cai, e como o NGINX percebe isso sozinho.
#
# Aviso que economiza tempo: HEALTH CHECK ATIVO (o NGINX bater periodicamente
# num /health) e recurso do NGINX Plus. No open-source o que existe e o health
# check PASSIVO: o NGINX so descobre que um servidor caiu quando uma requisicao
# de verdade falha nele. E o que `max_fails`/`fail_timeout` controlam.
##############################################################################

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format lb '"$request" -> $upstream_addr status=$status '
                  'upstream_status=$upstream_status rt=$request_time';
    access_log /var/log/nginx/access.log lb;
    error_log  /var/log/nginx/error.log warn;

    # ========================================================================
    # 1. ROUND ROBIN - o padrao
    #
    # Distribui em ordem circular, ignorando quanto tempo cada request demora.
    # Bom quando todas as requisicoes custam mais ou menos o mesmo.
    # ========================================================================
    upstream rr {
        server app1:3000;
        server app2:3000;
        server app3:3000;
        keepalive 16;
    }

    # ========================================================================
    # 2. LEAST_CONN - manda para quem tem menos conexoes ativas
    #
    # A diferenca aparece quando as requisicoes tem duracoes MUITO diferentes:
    # o round robin continua enfiando trabalho em quem ja esta ocupado, o
    # least_conn desvia.
    # ========================================================================
    upstream least {
        least_conn;
        server app1:3000;
        server app2:3000;
        server app3:3000;
        keepalive 16;
    }

    # ========================================================================
    # 3. IP_HASH - afinidade por IP de origem
    #
    # O mesmo cliente cai sempre na mesma instancia. Era a forma classica de
    # manter sessao em memoria funcionando.
    #
    # Limitacoes que costumam morder:
    #   - clientes atras de um mesmo NAT viram um IP so e desequilibram tudo;
    #   - so olha os 3 primeiros octetos do IPv4;
    #   - tirar uma instancia REMAPEIA todos os clientes (nao e consistente).
    # Hoje, sessao em store compartilhado (Redis) costuma ser melhor ideia.
    # ========================================================================
    upstream iphash {
        ip_hash;
        server app1:3000;
        server app2:3000;
        server app3:3000;
    }

    # ========================================================================
    # 4. HASH CONSISTENTE POR URI - afinidade por recurso
    #
    # Mesma URI sempre na mesma instancia: cada uma so cacheia a fatia que lhe
    # cabe. Com `consistent`, tirar 1 de 3 remapeia ~1/3 das chaves em vez de
    # todas - compare com o ip_hash acima.
    # ========================================================================
    upstream hash_uri {
        hash $request_uri consistent;
        server app1:3000;
        server app2:3000;
        server app3:3000;
        keepalive 16;
    }

    # ========================================================================
    # 5. PESOS - maquinas desiguais
    #
    # app1 recebe 3x mais que app2. Serve quando o parque nao e homogeneo.
    # ========================================================================
    upstream pesos {
        server app1:3000 weight=3;
        server app2:3000 weight=1;
        keepalive 16;
    }

    # ========================================================================
    # 6. FAILOVER PASSIVO + SERVIDOR DE RESERVA
    #
    # max_fails=2 fail_timeout=10s: apos 2 falhas em 10s, o NGINX considera a
    # instancia fora do ar e para de mandar trafego por 10s. Depois tenta de
    # novo, sozinho.
    #
    # `backup` so recebe trafego quando TODAS as primarias estao fora. E o
    # servidor de plantao - normalmente apontando para uma pagina de
    # manutencao ou uma instancia menor.
    # ========================================================================
    upstream com_reserva {
        server app1:3000 max_fails=2 fail_timeout=10s;
        server app2:3000 max_fails=2 fail_timeout=10s;
        server reserva:3000 backup;
        keepalive 16;
    }

    # ========================================================================
    # 7. RETENTATIVA EM OUTRA INSTANCIA
    #
    # `quebrado` responde 500 em tudo. Sem proxy_next_upstream http_500, o
    # cliente receberia esse 500. Com ele, o NGINX tenta a proxima instancia e
    # o cliente recebe 200 sem saber que houve falha.
    #
    # CUIDADO: reenviar automaticamente so e seguro em operacao IDEMPOTENTE.
    # Incluir `non_idempotent` faz o NGINX repetir POST tambem - e o caminho
    # curto para cobrar o cliente duas vezes.
    # ========================================================================
    # `max_fails=0` desliga o health check passivo para esta instancia: ela
    # NUNCA e retirada da rotacao. Aqui isso e proposital, para o exemplo
    # continuar batendo no `quebrado` a cada rodada e a retentativa ficar
    # visivel. Sem isso, o proprio NGINX ejetaria a instancia e o teste passaria
    # a medir a ejecao, nao a retentativa.
    upstream com_retry {
        server quebrado:3000 max_fails=0;
        server app1:3000;
        keepalive 16;
    }

    # Mesmas instancias, upstream SEPARADO.
    #
    # Separar nao e capricho: o estado "esta instancia esta fora" pertence ao
    # UPSTREAM, nao a location. Se as duas locations dividissem o mesmo
    # upstream, o `http_500` da primeira contaria falha para o `max_fails` e
    # ejetaria o `quebrado` - e a segunda location, que deveria mostrar o 500
    # passando direto, tambem pararia de ver falha. Foi exatamente o que
    # aconteceu na primeira versao deste exemplo.
    upstream sem_retry {
        server quebrado:3000 max_fails=0;
        server app1:3000;
        keepalive 16;
    }

    # `down` marca uma instancia como fora de servico permanentemente. E como
    # se tira uma maquina do balanceador para manutencao sem apagar a linha.
    upstream com_down {
        server app1:3000;
        server app2:3000 down;
        server app3:3000;
        keepalive 16;
    }

    server {
        listen 80;
        server_name localhost;

        location /rr/        { proxy_pass http://rr/;        include /etc/nginx/snippets/proxy.conf; }
        location /least/     { proxy_pass http://least/;     include /etc/nginx/snippets/proxy.conf; }
        location /iphash/    { proxy_pass http://iphash/;    include /etc/nginx/snippets/proxy.conf; }
        location /hash-uri/  { proxy_pass http://hash_uri/;  include /etc/nginx/snippets/proxy.conf; }
        location /pesos/     { proxy_pass http://pesos/;     include /etc/nginx/snippets/proxy.conf; }
        location /down/      { proxy_pass http://com_down/;  include /etc/nginx/snippets/proxy.conf; }

        location /reserva/ {
            proxy_pass http://com_reserva/;
            include /etc/nginx/snippets/proxy.conf;
        }

        location /retry/ {
            proxy_next_upstream error timeout http_500 http_502 http_503;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 10s;

            proxy_pass http://com_retry/;
            include /etc/nginx/snippets/proxy.conf;
        }

        # As mesmas instancias, mas SEM retentativa - metade das requisicoes
        # cai no `quebrado` e o 500 chega ao cliente.
        location /sem-retry/ {
            proxy_next_upstream off;
            proxy_pass http://sem_retry/;
            include /etc/nginx/snippets/proxy.conf;
        }
    }
}

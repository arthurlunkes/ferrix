##############################################################################
# CONTROLE DE ACESSO E AUTENTICACAO
#
# Tres camadas, da mais barata para a mais forte:
#   1. por IP de origem   (allow/deny)      - de graca, mas IP se falsifica
#   2. por senha          (basic auth)      - simples, exige HTTPS
#   3. por certificado    (mTLS)            - o cliente tambem prova quem e
#
# Cada uma responde a uma pergunta diferente: "de onde veio", "quem sabe a
# senha" e "quem possui a chave privada".
#
#
# >>> A ARMADILHA QUE ANULA TUDO ISSO <<<
#
# Nenhuma location protegida aqui usa `return`. Nao e estilo, e necessidade:
#
#   location /admin/ {
#       auth_basic "Admin";
#       auth_basic_user_file /etc/nginx/htpasswd;
#       return 200 "conteudo secreto";      # <-- ABERTO PARA QUALQUER UM
#   }
#
# `return` roda na fase REWRITE, que acontece ANTES da fase ACCESS, onde
# `auth_basic` e `allow`/`deny` atuam. A resposta sai antes de a autenticacao
# rodar - e o NGINX nao avisa nada: sobe limpo, `nginx -t` passa, e o endpoint
# devolve 200 para quem pedir.
#
# Foi exatamente o que aconteceu na primeira versao deste exemplo: as seis
# rotas "protegidas" respondiam 200 sem senha nenhuma.
#
# Por isso o conteudo protegido e servido como ARQUIVO (fase de conteudo, que
# vem depois da fase access). Vale o mesmo para `proxy_pass`.
##############################################################################

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format acesso '$remote_addr usuario="$remote_user" '
                      '"$request" status=$status '
                      'cert="$ssl_client_s_dn" verify=$ssl_client_verify';
    access_log /var/log/nginx/access.log acesso;
    error_log  /var/log/nginx/error.log notice;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ------------------------------------------------------------------------
    # `geo` classifica o IP em grupos nomeados. Fica mais legivel que espalhar
    # allow/deny por varias locations, e o resultado pode ser usado em `map`,
    # em chave de rate limit, em log...
    # ------------------------------------------------------------------------
    geo $origem {
        default        externa;
        127.0.0.1      local;
        172.31.0.1     host_docker;   # o host aparece como gateway da rede
        172.31.0.0/16  rede_interna;
    }

    server {
        listen 80;
        listen 443 ssl;
        http2 on;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        ssl_certificate     /etc/nginx/certs/servidor.crt;
        ssl_certificate_key /etc/nginx/certs/servidor.key;

        # --------------------------------------------------------------------
        # mTLS declarado no SERVIDOR, mas OPCIONAL.
        #
        # `optional` pede o certificado e valida se vier, sem recusar quem nao
        # apresentar. Isso permite ter, no mesmo servidor, rotas publicas e
        # rotas que exigem certificado - a decisao vai para a location, olhando
        # $ssl_client_verify.
        #
        # Com `ssl_verify_client on`, a recusa acontece no handshake TLS: o
        # cliente leva um erro de conexao, sem status HTTP e sem mensagem util.
        # --------------------------------------------------------------------
        ssl_client_certificate /etc/nginx/certs/ca.crt;
        ssl_verify_client optional;

        # Expoe o que o NGINX identificou. `add_header` roda depois da fase de
        # acesso, entao aqui as variaveis ja estao preenchidas - diferente do
        # `return`, que roda antes.
        add_header X-Origem  $origem       always;
        add_header X-Usuario $remote_user  always;

        # ====================================================================
        # 1. PUBLICO
        # ====================================================================
        location / {
        }

        # ====================================================================
        # 2. SO DA REDE INTERNA
        #
        # As regras sao avaliadas na ORDEM e vale a PRIMEIRA que casar. Por
        # isso o `deny` do gateway vem antes do `allow` da rede: invertido, o
        # allow casaria primeiro e o deny nunca seria alcancado.
        #
        # No Docker o host aparece como o gateway da rede, entao negar
        # 172.31.0.1 e o que torna este exemplo demonstravel a partir do seu
        # terminal (403) e de dentro de um container (200).
        # ====================================================================
        location /interno/ {
            deny  172.31.0.1;
            allow 172.31.0.0/16;
            deny  all;
        }

        # ====================================================================
        # 3. SO COM SENHA
        #
        # O basic auth manda usuario e senha em base64 - que e codificacao, nao
        # criptografia. Sobre HTTP puro, qualquer um no caminho le a senha.
        # Basic auth sem HTTPS e o mesmo que senha nenhuma.
        # ====================================================================
        location /admin/ {
            auth_basic "Area administrativa";
            auth_basic_user_file /etc/nginx/htpasswd;
        }

        # ====================================================================
        # 4. IP **OU** SENHA  (satisfy any)
        #
        # Quem esta na rede interna entra direto; de fora, precisa da senha.
        # E o arranjo tipico de painel interno: comodo no escritorio, protegido
        # fora dele.
        # ====================================================================
        location /ou/ {
            satisfy any;

            deny  172.31.0.1;
            allow 172.31.0.0/16;
            deny  all;

            auth_basic "Rede interna ou senha";
            auth_basic_user_file /etc/nginx/htpasswd;
        }

        # ====================================================================
        # 5. IP **E** SENHA  (satisfy all - o padrao)
        #
        # Precisa das duas coisas. `satisfy all` e o comportamento padrao; esta
        # explicito aqui so para contrastar com o bloco acima.
        # ====================================================================
        location /e/ {
            satisfy all;

            deny  172.31.0.1;
            allow 172.31.0.0/16;
            deny  all;

            auth_basic "Rede interna E senha";
            auth_basic_user_file /etc/nginx/htpasswd;
        }

        # ====================================================================
        # 6. mTLS - so com certificado de cliente valido
        #
        # $ssl_client_verify vale SUCCESS, FAILED:<motivo> ou NONE.
        #
        # Aqui o `return` dentro do `if` e legitimo: nao se esta delegando a
        # decisao para a fase de acesso, esta se decidindo explicitamente na
        # fase rewrite, com uma variavel que o handshake TLS ja preencheu.
        #
        # Os tres desfechos, medidos:
        #   sem certificado          -> 403 (chega aqui, $ssl_client_verify=NONE)
        #   certificado da CA certa  -> 200
        #   certificado de outra CA  -> 400, e NAO 403
        #
        # O 400 surpreende: com `optional`, um certificado que falha na
        # verificacao e recusado pelo proprio NGINX antes de a requisicao
        # chegar nesta location. Quem quiser tratar esse caso com mensagem
        # propria precisa de `optional_no_ca`, que aceita o certificado sem
        # exigir CA confiavel e deixa a decisao inteira para o
        # $ssl_client_verify aqui embaixo.
        # ====================================================================
        location /mtls/ {
            if ($ssl_client_verify != SUCCESS) {
                return 403 "certificado de cliente ausente ou invalido: $ssl_client_verify\n";
            }

            add_header X-Cliente-DN $ssl_client_s_dn always;
        }

        # Diz o que o NGINX enxerga da requisicao atual.
        location = /_debug {
            default_type text/plain;
            return 200 "ip=$remote_addr origem=$origem tls=$ssl_protocol cert_verify=$ssl_client_verify\n";
        }
    }
}

##############################################################################
# CANARY E BLUE-GREEN
#
# Duas estrategias diferentes de colocar versao nova no ar:
#
#   CANARY      manda uma FATIA do trafego (10%) para a versao nova e observa.
#               As duas versoes convivem por horas ou dias.
#
#   BLUE-GREEN  mantem dois ambientes completos e vira 100% do trafego de um
#               para o outro de uma vez. O valor esta na volta: se der errado,
#               desfaz na mesma velocidade.
#
# O NGINX open-source faz as duas sem modulo nenhum.
##############################################################################

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format deploy '"$request" versao_escolhida=$destino_canary '
                      '-> $upstream_addr status=$status';
    access_log /var/log/nginx/access.log deploy;
    error_log  /var/log/nginx/error.log warn;

    upstream v1 {
        server app-v1-a:3000;
        server app-v1-b:3000;
        keepalive 16;
    }

    upstream v2 {
        server app-v2:3000;
        keepalive 16;
    }

    # ------------------------------------------------------------------------
    # STICKY: o visitante precisa continuar na MESMA versao
    #
    # Sem isso, um usuario no canary alterna entre v1 e v2 a cada requisicao -
    # e como o frontend novo costuma falar com uma API nova, ele quebra no meio
    # da navegacao. Pior ainda: bug que so acontece "as vezes" e que ninguem
    # consegue reproduzir.
    #
    # A solucao e sortear UMA vez e gravar a escolha num cookie.
    # ------------------------------------------------------------------------

    # 1) Sorteio: distribui por uma chave estavel dentro da requisicao.
    #
    # $request_id e unico por requisicao - de proposito. Assim o sorteio e
    # sempre novo para quem ainda nao tem cookie, e a estabilidade fica por
    # conta do cookie, nao do hash. Usar $remote_addr aqui prenderia todos os
    # usuarios atras de um mesmo NAT na mesma versao.
    split_clients "$request_id" $sorteio {
        10%     v2;      # canario
        *       v1;      # producao
    }

    # 2) Se ja existe cookie, ele manda. Senao, vale o sorteio.
    map $cookie_versao $versao_sticky {
        default  $sorteio;
        "v1"     v1;
        "v2"     v2;
    }

    # 3) Um header force a versao, para QA testar sem depender de sorte.
    #    Em producao, proteja isto (rede interna, token) - senao qualquer um
    #    escolhe em qual versao quer entrar.
    map $http_x_versao $destino_canary {
        default  $versao_sticky;
        "v1"     v1;
        "v2"     v2;
    }

    # ------------------------------------------------------------------------
    # BLUE-GREEN: uma unica chave vira todo o trafego
    #
    # Trocar o `default` desta linha e recarregar move 100% do trafego. Como
    # `nginx -s reload` sobe workers novos e deixa os antigos terminarem as
    # requisicoes em andamento, a virada nao derruba ninguem.
    #
    # Em producao isto costuma virar um `include /etc/nginx/ambiente-ativo.conf`
    # com uma linha so, para o deploy reescrever o arquivo e recarregar - sem
    # tocar no nginx.conf principal.
    # ------------------------------------------------------------------------
    map $host $ambiente_ativo {
        default  v1;     # <- azul no ar. Troque para v2 (verde) e recarregue.
    }

    server {
        listen 80;
        server_name localhost;

        # ====================================================================
        # CANARY - 10% para a v2, com afinidade por cookie
        # ====================================================================
        location / {
            # Grava a escolha para as proximas requisicoes deste visitante.
            # Sem `add_header ... always` o cookie nao acompanha respostas de
            # erro, e o usuario que pegasse um 500 sairia da versao sorteada.
            add_header Set-Cookie "versao=$destino_canary; Path=/; Max-Age=3600" always;
            add_header X-Versao-Escolhida $destino_canary always;

            proxy_pass http://$destino_canary;
            include /etc/nginx/snippets/proxy.conf;
        }

        # ====================================================================
        # CANARY SEM STICKY - so para ver a diferenca
        #
        # Cada requisicao e um sorteio novo. E o que NAO se deve fazer com
        # trafego de usuario real.
        # ====================================================================
        location /sem-sticky/ {
            add_header X-Versao-Escolhida $sorteio always;
            proxy_pass http://$sorteio/;
            include /etc/nginx/snippets/proxy.conf;
        }

        # ====================================================================
        # BLUE-GREEN - todo o trafego segue o ambiente ativo
        # ====================================================================
        location /bluegreen/ {
            add_header X-Ambiente-Ativo $ambiente_ativo always;
            proxy_pass http://$ambiente_ativo/;
            include /etc/nginx/snippets/proxy.conf;
        }

        location = /_debug {
            default_type text/plain;
            return 200 "sorteio=$sorteio cookie=$cookie_versao header=$http_x_versao ambiente_ativo=$ambiente_ativo\n";
        }
    }
}

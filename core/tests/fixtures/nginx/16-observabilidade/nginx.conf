##############################################################################
# OBSERVABILIDADE AVANCADA
#
# O exemplo 7 mostrou o stub_status. Aqui o assunto e o que se faz com ele em
# escala: log estruturado que uma ferramenta consegue ler, as variaveis de
# tempo que separam "backend lento" de "cliente lento", e as metricas indo para
# o Prometheus.
##############################################################################

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ------------------------------------------------------------------------
    # LOG EM JSON
    #
    # `escape=json` NAO e opcional. Sem ele, um User-Agent contendo aspas ou
    # uma barra invertida quebra o JSON da linha, e o coletor descarta o
    # registro silenciosamente - justamente os requests estranhos, que sao os
    # que interessam.
    #
    # As virgulas e chaves aqui sao literais: o NGINX nao tem "formato JSON",
    # so interpolacao de variaveis. Por isso o cuidado com a sintaxe.
    # ------------------------------------------------------------------------
    log_format json escape=json
      '{'
        '"hora":"$time_iso8601",'
        '"ip":"$remote_addr",'
        '"metodo":"$request_method",'
        '"caminho":"$uri",'
        '"query":"$args",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"referer":"$http_referer",'
        '"agente":"$http_user_agent",'

        # Os quatro tempos. A diferenca entre eles e o diagnostico:
        #   upstream_connect  demorou para ABRIR a conexao   -> rede/saturacao
        #   upstream_header   demorou para PENSAR            -> backend lento
        #   upstream_response tempo total do upstream
        #   request_time      tempo total, incluindo enviar ao cliente
        #
        # request_time MUITO maior que upstream_response = o backend foi
        # rapido e o CLIENTE e que e lento (rede ruim, celular, download).
        # Culpar o backend nesse caso e o erro de diagnostico mais comum.
        '"t_request":$request_time,'
        '"t_upstream_connect":"$upstream_connect_time",'
        '"t_upstream_header":"$upstream_header_time",'
        '"t_upstream_response":"$upstream_response_time",'

        # Com retentativa, estas variaveis viram LISTAS separadas por virgula
        # (ex.: "10.0.0.2:3000, 10.0.0.3:3000") - por isso vao como string.
        '"upstream":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"cache":"$upstream_cache_status",'
        '"request_id":"$request_id"'
      '}';

    # Formato legivel por humanos, para acompanhar ao vivo no terminal.
    log_format humano '$remote_addr "$request" $status '
                      'rt=$request_time urt=$upstream_response_time';

    # ------------------------------------------------------------------------
    # LOGGING CONDICIONAL
    #
    # Health check a cada 5 segundos vira ~500 mil linhas por mes que nao
    # dizem nada. `map` marca o que nao interessa e `access_log ... if=`
    # descarta - chave vazia ou "0" significa "nao registre".
    # ------------------------------------------------------------------------
    map $request_uri $vale_logar {
        default           1;
        ~^/health         0;
        ~^/metrics        0;
        ~^/nginx-status   0;
    }

    # Registra so o que deu errado ou demorou - util para um arquivo separado
    # de "suspeitos", sem precisar varrer o log inteiro.
    map $status $eh_erro {
        default  0;
        ~^[45]   1;
    }

    access_log /var/log/nginx/access.log json    if=$vale_logar;
    access_log /var/log/nginx/erros.log  json    if=$eh_erro;
    access_log /dev/stdout               humano  if=$vale_logar;

    error_log /var/log/nginx/error.log warn;

    upstream backend {
        server app1:3000;
        server app2:3000;
        keepalive 16;
    }

    server {
        listen 80;
        server_name localhost;

        # --------------------------------------------------------------------
        # O que o exporter le.
        #
        # `stub_status` da 7 numeros - e so isso que o
        # nginx-prometheus-exporter consegue extrair do NGINX open-source.
        # Metricas por endpoint, por upstream e por status code sao do NGINX
        # Plus; no open-source elas saem do LOG, nao daqui.
        # --------------------------------------------------------------------
        location /nginx-status {
            stub_status on;
            access_log off;
            allow 172.32.0.0/16;   # so a rede do compose (o exporter)
            deny  all;
        }

        location /health {
            access_log off;
            return 200 "ok\n";
        }

        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host            $host;
            proxy_set_header X-Request-Id    $request_id;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection      "";
            proxy_read_timeout 20s;
        }
    }
}

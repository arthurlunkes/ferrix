##############################################################################
# STREAM MODULE - BALANCEAMENTO DE CAMADA 4 (TCP e UDP)
#
# Tudo que os exemplos anteriores fizeram acontece no bloco `http`, onde o
# NGINX LE a requisicao: sabe o metodo, o Host, o caminho, os headers.
#
# O bloco `stream` opera abaixo disso. Ele so move bytes entre dois sockets, e
# nao faz ideia do que esta transportando. E o que permite balancear Postgres,
# Redis, MQTT, SMTP - qualquer coisa sobre TCP ou UDP.
#
# O preco de nao entender o protocolo:
#   - nada de roteamento por caminho ou por Host
#   - nada de cache, gzip, cabecalhos, rewrite
#   - nada de X-Forwarded-For (nao ha header nenhum para acrescentar)
#
# O ultimo item e o problema pratico mais serio, e a solucao esta abaixo:
# PROXY protocol.
##############################################################################

events {
    worker_connections 1024;
}

stream {
    # $upstream_addr aqui e o backend escolhido; $status nao existe, porque
    # nao ha status - nao ha protocolo de aplicacao para ter um.
    log_format camada4 '$remote_addr -> $upstream_addr '
                       'protocolo=$protocol sni="$ssl_preread_server_name" '
                       'enviados=$bytes_sent recebidos=$bytes_received '
                       'duracao=$session_time';

    access_log /var/log/nginx/stream.log camada4;
    error_log  /var/log/nginx/stream-error.log warn;

    # ========================================================================
    # 1. BALANCEAMENTO TCP PURO
    #
    # Os backends falam HTTP, mas o NGINX aqui nao sabe disso - por isso da
    # para testar com `curl` mesmo sendo camada 4. Repare no que o backend
    # enxerga como IP de origem: o do proxy, nao o do cliente.
    # ========================================================================
    upstream tcp_backends {
        least_conn;
        server app1:3000;
        server app2:3000;
    }

    server {
        listen 9001;
        proxy_pass tcp_backends;
        proxy_connect_timeout 3s;
        proxy_timeout 30s;
    }

    # ========================================================================
    # 2. PRESERVANDO O IP DO CLIENTE  -  PROXY protocol
    #
    # Como nao ha header para acrescentar, o PROXY protocol resolve por fora:
    # antes de repassar os bytes da aplicacao, o proxy envia uma linha extra
    # dizendo quem e o cliente original.
    #
    # >>> O backend PRECISA estar esperando essa linha. <<<
    #
    # Se `proxy_protocol on` aqui e o backend nao souber ler, ele recebe
    # "PROXY TCP4 1.2.3.4 ..." como se fosse o inicio da requisicao e a conexao
    # quebra - com um erro que nao explica nada. O inverso tambem falha: o
    # backend esperando a linha e o proxy nao enviando.
    #
    # No destino (ver web-pp/nginx.conf) e preciso:
    #     listen 80 proxy_protocol;
    #     set_real_ip_from <rede do proxy>;
    #     real_ip_header proxy_protocol;
    # ========================================================================
    upstream com_proxy_protocol {
        server web-pp:80;
    }

    server {
        listen 9002;
        proxy_pass com_proxy_protocol;
        proxy_protocol on;
    }

    # ========================================================================
    # 3. ROTEAMENTO POR SNI, SEM DESCRIPTOGRAFAR  -  ssl_preread
    #
    # `ssl_preread` espia o ClientHello do TLS - que trafega em texto claro,
    # por ser a primeira mensagem do handshake - e le o nome do servidor (SNI).
    # Com isso da para rotear por dominio sem ter a chave privada e sem
    # terminar o TLS: o trafego segue criptografado de ponta a ponta ate o
    # backend.
    #
    # E o que se usa quando o certificado precisa ficar no backend, ou quando
    # se roteia trafego de terceiros que nao se pode (nem deve) abrir.
    #
    # Compare com o exemplo 8: la a borda TERMINA o TLS e por isso precisa dos
    # certificados de todos os dominios. Aqui, nao precisa de nenhum.
    # ========================================================================
    map $ssl_preread_server_name $destino_tls {
        default      tls_alfa;
        alfa.local   tls_alfa;
        beta.local   tls_beta;
    }

    upstream tls_alfa { server tls-alfa:443; }
    upstream tls_beta { server tls-beta:443; }

    server {
        listen 9003;
        ssl_preread on;
        proxy_pass $destino_tls;
    }

    # ========================================================================
    # 4. BALANCEAMENTO UDP
    #
    # UDP nao tem conexao: cada datagrama e independente. O NGINX inventa uma
    # "sessao" para conseguir devolver a resposta ao remetente certo.
    #
    # >>> E a sessao e a unidade de balanceamento, NAO o datagrama. <<<
    #
    # A sessao e identificada pelo par ip:porta do cliente. Um cliente que
    # reaproveita o mesmo socket fica preso no MESMO backend, por mais
    # datagramas que envie. Medido com `node testar-udp.js 10`:
    #
    #   um socket, 10 datagramas      -> 10 no mesmo backend
    #   10 sockets, 1 datagrama cada  -> 5 e 5
    #
    # Isso importa de verdade: agente de metricas, resolver DNS e cliente de
    # syslog costumam abrir o socket uma vez e mante-lo aberto. Na pratica,
    # cada um deles vai conversar sempre com o mesmo backend, e a carga fica
    # bem menos distribuida do que o numero de datagramas sugere.
    #
    # proxy_responses 1: espere exatamente UM datagrama de volta e encerre a
    # sessao. Sem isso o NGINX fica esperando ate o proxy_timeout, segurando
    # memoria a toa. Para protocolos que respondem varios datagramas, ajuste o
    # numero; para os que nao respondem nada (syslog, statsd), use 0.
    # ========================================================================
    upstream udp_backends {
        server udp1:5353;
        server udp2:5353;
    }

    server {
        listen 5353 udp;
        proxy_pass udp_backends;
        proxy_responses 1;
        proxy_timeout 3s;
    }
}

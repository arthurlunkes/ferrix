##############################################################################
# Backend TLS "alfa.local". O certificado fica AQUI, nao no proxy - e essa a
# graca do ssl_preread: o proxy roteia sem nunca ver o conteudo.
##############################################################################

events {
    worker_connections 1024;
}

http {
    default_type text/plain;

    server {
        listen 443 ssl;
        server_name alfa.local;

        ssl_certificate     /etc/nginx/certs/alfa.crt;
        ssl_certificate_key /etc/nginx/certs/alfa.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            return 200 "backend TLS alfa\n  sni recebido: \\n  host        : \\n";
        }
    }
}

##############################################################################
# Backend TLS "beta.local". O certificado fica AQUI, nao no proxy - e essa a
# graca do ssl_preread: o proxy roteia sem nunca ver o conteudo.
##############################################################################

events {
    worker_connections 1024;
}

http {
    default_type text/plain;

    server {
        listen 443 ssl;
        server_name beta.local;

        ssl_certificate     /etc/nginx/certs/beta.crt;
        ssl_certificate_key /etc/nginx/certs/beta.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            return 200 "backend TLS beta\n  sni recebido: \\n  host        : \\n";
        }
    }
}

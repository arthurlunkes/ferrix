##############################################################################
# Backend que fica ATRAS do proxy TCP e sabe ler o PROXY protocol.
#
# Sem as tres linhas abaixo, este servidor veria todo o trafego vindo do IP do
# proxy - e log, rate limit por IP e allow/deny ficariam todos inuteis.
##############################################################################

events {
    worker_connections 1024;
}

http {
    default_type text/plain;

    log_format pp '$remote_addr (real) via $proxy_protocol_addr "$request"';
    access_log /var/log/nginx/access.log pp;

    server {
        # `proxy_protocol` no listen: esta porta SO aceita conexoes que comecem
        # com a linha do PROXY protocol. Acessar direto, sem o proxy na frente,
        # falha - e o motivo de a porta nao ser exposta no compose.
        listen 80 proxy_protocol;

        # De quem se aceita a informacao de IP. Confiar em qualquer origem
        # permitiria a qualquer um forjar o proprio IP.
        set_real_ip_from 172.33.0.0/16;
        real_ip_header   proxy_protocol;

        location / {
            # $remote_addr ja foi reescrito para o IP do cliente real.
            # $proxy_protocol_addr guarda o que veio na linha do protocolo.
            return 200 "backend web-pp\n  remote_addr        : $remote_addr\n  proxy_protocol_addr: $proxy_protocol_addr\n  proxy_protocol_port: $proxy_protocol_port\n";
        }
    }
}

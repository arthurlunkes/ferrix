##############################################################################
# HTTP/3 e QUIC
#
# HTTP/3 nao roda sobre TCP. Ele roda sobre QUIC, que roda sobre UDP - e isso
# muda coisas praticas:
#
#   - a porta 443/UDP precisa estar aberta, alem da 443/TCP
#   - TLS 1.3 e obrigatorio (o handshake faz parte do proprio QUIC)
#   - nao existe "HTTP/3 sem criptografia"
#
# O ganho principal e o fim do head-of-line blocking do TCP: no HTTP/2, um
# pacote perdido trava TODAS as streams multiplexadas na mesma conexao, porque
# o TCP entrega em ordem. No QUIC cada stream tem controle proprio, entao a
# perda afeta so a stream dela. Em rede movel, e a diferenca que se sente.
##############################################################################

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # $server_protocol mostra a versao negociada de verdade: HTTP/1.1, HTTP/2
    # ou HTTP/3. E a forma mais direta de conferir que o h3 esta em uso.
    log_format versoes '$remote_addr protocolo=$server_protocol '
                       'tls=$ssl_protocol "$request" $status';
    access_log /var/log/nginx/access.log versoes;
    error_log  /var/log/nginx/error.log warn;

    # QUIC embute o TLS 1.3 no proprio handshake. Deixar TLS 1.2 na lista nao
    # habilita QUIC para ele - simplesmente nao existe QUIC com TLS 1.2.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    server {
        # ====================================================================
        # As tres portas de entrada
        #
        # `quic` e `ssl` sao sockets DIFERENTES, apesar do mesmo numero: um e
        # UDP, o outro e TCP. Manter os dois nao e redundancia - e o unico
        # jeito de atender quem ainda nao fala HTTP/3.
        #
        # `reuseport` faz o kernel distribuir as conexoes UDP entre os workers.
        # Sem ele, um unico worker recebe tudo. Cuidado: so pode aparecer UMA
        # vez por combinacao de endereco e porta em todo o arquivo - repetir em
        # outro server{} impede o NGINX de subir.
        # ====================================================================
        listen 443 quic reuseport;
        listen 443 ssl;
        http2 on;

        server_name localhost;

        ssl_certificate     /etc/nginx/certs/servidor.crt;
        ssl_certificate_key /etc/nginx/certs/servidor.key;

        # ====================================================================
        # Alt-Svc: como o navegador DESCOBRE que ha HTTP/3
        #
        # A primeira requisicao de um cliente e SEMPRE por TCP - ele nao tem
        # como adivinhar que existe um servidor QUIC do outro lado. Este header
        # anuncia "eu tambem atendo h3 nesta porta, por 24h", e o navegador
        # passa a tentar HTTP/3 nas proximas.
        #
        # Sem este header, o servidor atende HTTP/3 e nenhum navegador usa.
        # E o esquecimento mais comum ao habilitar QUIC.
        #
        # >>> A PORTA ANUNCIADA E A PORTA PUBLICA, NAO A INTERNA. <<<
        #
        # Aqui vai 8443 porque e assim que o compose publica este servidor. Se
        # ficasse 443 (a porta de dentro do container), o navegador tentaria
        # QUIC em 443, nao acharia nada e continuaria em HTTP/2 - sem erro
        # nenhum na tela e sem uma linha no log. Em producao, onde a porta
        # publica costuma ser mesmo a 443, os dois numeros coincidem e o
        # problema nao aparece.
        # ====================================================================
        add_header Alt-Svc 'h3=":8443"; ma=86400' always;

        # Informa ao cliente o identificador da conexao QUIC - util so para
        # depuracao, nao e necessario em producao.
        add_header QUIC-Status $http3 always;

        root /usr/share/nginx/html;
        index index.html;

        location / {
        }

        # Diz qual protocolo foi realmente usado nesta requisicao.
        location = /versao {
            default_type text/plain;
            return 200 "protocolo : $server_protocol\ntls       : $ssl_protocol\nhttp3     : $http3\n";
        }
    }

    # HTTP puro so redireciona.
    server {
        listen 80;
        server_name localhost;
        return 301 https://$host$request_uri;
    }
}

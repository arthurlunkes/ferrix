# Excecoes customizadas, carregadas ANTES do Core Rule Set.
#
# Sem um arquivo assim, o caminho de menor esforco diante de um falso positivo
# e baixar a paranoia ou desligar o WAF - que e jogar fora a protecao inteira
# por causa de uma rota. Excecao cirurgica e o certo.
#
# Os IDs de 1 a 99999 sao reservados para regras locais; o CRS usa 900000+.

# ---------------------------------------------------------------------------
# Falso positivo real, medido neste exemplo:
#
#   "quero fazer UNION SELECT dos dados, alguem ajuda?"
#
# E um comentario perfeitamente legitimo num forum de desenvolvedores - e o
# CRS o bloqueia com 403, porque "UNION SELECT" e exatamente o que uma SQL
# injection parece.
#
# A regra abaixo remove as verificacoes de SQL injection APENAS do parametro
# `texto` da rota /comentario. Verificado:
#
#   /busca?q=<texto>           -> 403  (sem excecao)
#   /comentario?texto=<texto>  -> 200  (excecao vale)
#   /comentario?outro=<texto>  -> 403  (outro parametro, excecao nao vale)
#
# ctl:ruleRemoveTargetByTag tira um ALVO especifico de todas as regras com a
# tag informada, em vez de desligar as regras inteiras - a diferenca entre
# abrir uma fresta e abrir a porta.
# ---------------------------------------------------------------------------
SecRule REQUEST_URI "@beginsWith /comentario" \
    "id:1001,\
     phase:1,\
     pass,\
     nolog,\
     ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:texto"


##############################################################################
# njs - JAVASCRIPT DENTRO DO NGINX
#
# O modulo ja vem na imagem oficial como biblioteca dinamica; falta so
# carrega-lo. Nao precisa compilar nada.
#
# Quando njs vale a pena: quando a logica exige calculo, laco ou criptografia.
# `map` faz de/para e `if` faz comparacao - nenhum dos dois calcula um HMAC
# nem percorre uma lista.
#
# Quando NAO vale: para de/para simples, `map` e mais rapido e mais legivel.
# njs roda no worker, entao erro no script e CPU gasta ali viram latencia.
##############################################################################

# Precisa vir ANTES do bloco http, no nivel principal do arquivo.
load_module modules/ngx_http_js_module.so;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format njs '$remote_addr "$request" $status '
                   'motivo="$motivo_recusa" tenant="$tenant"';
    access_log /var/log/nginx/access.log njs;
    error_log  /var/log/nginx/error.log info;

    # Caminho do script. O arquivo e lido no start e a cada `nginx -s reload`.
    js_path /etc/nginx/njs/;
    js_import principal from principal.js;

    # ------------------------------------------------------------------------
    # js_set liga uma variavel do NGINX a uma funcao JavaScript.
    #
    # A funcao roda quando a variavel e LIDA - a mesma avaliacao preguicosa do
    # `map` (ver exemplo 9), com a mesma consequencia: o resultado fica
    # cacheado na primeira leitura.
    # ------------------------------------------------------------------------
    js_set $motivo_recusa principal.validarLink;
    js_set $tenant        principal.tenantDoJwt;

    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;

        # ====================================================================
        # 1. ARQUIVOS COM URL ASSINADA
        #
        # $motivo_recusa vem vazio quando o link e valido. O `if` aqui e
        # seguro: e um `return` dentro de `if`, um dos dois usos permitidos.
        #
        # Compare com o modulo secure_link, que ja existe no NGINX: ele so faz
        # MD5, tem formato fixo e responde 403 sem dizer por que. Aqui da para
        # usar SHA-256 e informar se o problema foi expiracao ou assinatura -
        # o que muda tudo para quem esta integrando.
        # ====================================================================
        location /privado/ {
            if ($motivo_recusa != "") {
                return 403 "acesso negado: $motivo_recusa\n";
            }

            default_type text/plain;
            return 200 "conteudo privado liberado\n  arquivo: $uri\n";
        }

        # ====================================================================
        # 2. EMISSOR DE LINKS - njs gerando a resposta (js_content)
        #
        #   /assinar
        #   /assinar?caminho=/privado/nota.pdf&segundos=5
        # ====================================================================
        location = /assinar {
            js_content principal.emitirLink;
        }

        # ====================================================================
        # 3. TENANT VINDO DO JWT, SEM SERVICO EXTERNO
        #
        # O exemplo 9 fez isto com auth_request + um container de validacao,
        # porque `auth_jwt` e do NGINX Plus. Aqui o token e conferido dentro do
        # proprio worker: um salto de rede a menos por requisicao.
        # ====================================================================
        location /api/ {
            if ($tenant = "") {
                return 401 "token ausente, invalido ou expirado\n";
            }

            default_type text/plain;
            return 200 "autenticado\n  tenant: $tenant\n";
        }

        # ====================================================================
        # 4. njs COMO APLICACAO
        # ====================================================================
        location = /saude {
            js_content principal.saude;
        }

        location = / {
            default_type text/plain;
            return 200 "njs\n  GET /assinar          emite um link assinado\n  GET /privado/<arq>    exige link assinado\n  GET /api/algo         exige JWT valido\n  GET /saude            resposta montada pelo njs\n";
        }
    }
}

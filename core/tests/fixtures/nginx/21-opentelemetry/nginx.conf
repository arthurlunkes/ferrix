##############################################################################
# OPENTELEMETRY - TRACING DISTRIBUIDO
#
# O exemplo 16 respondia "quanto tempo demorou?". Este responde "demorou ONDE?"
#
# Num log, cada servico conta a sua parte e ninguem costura as partes. Num
# trace, a requisicao inteira aparece como uma arvore de spans - da borda ate a
# consulta no banco - e fica visivel qual pedaco consumiu o tempo.
#
# A costura acontece pelo header `traceparent` (padrao W3C Trace Context), que
# cada servico recebe, propaga e usa como pai do proprio span.
##############################################################################

load_module modules/ngx_otel_module.so;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # $otel_trace_id e $otel_span_id existem em qualquer lugar da config. Poe-los
    # no log e o que liga as duas ferramentas: aparece um erro no log, copia-se
    # o trace_id e abre-se o trace exato no Jaeger.
    #
    # >>> MAS ATENCAO: o trace_id aparece no log MESMO quando a requisicao nao
    # foi amostrada. <<<
    #
    # O NGINX gera o identificador de qualquer forma; o que a amostragem decide
    # e se o span sera ENVIADO. Na pratica: voce copia um trace_id de uma linha
    # de log de /catalogo, cola no Jaeger e nao acha nada - nao porque o trace
    # sumiu, mas porque ele nunca foi exportado.
    #
    # Verificado: das 30 requisicoes a /catalogo, todas com trace_id no log,
    # apenas 2 existiam no Jaeger. Quem precisa achar 100% dos traces no log
    # nao pode amostrar - ou precisa registrar tambem se houve amostragem.
    log_format otel '$remote_addr "$request" $status '
                    'trace_id=$otel_trace_id span_id=$otel_span_id '
                    'rt=$request_time';
    access_log /var/log/nginx/access.log otel;
    error_log  /var/log/nginx/error.log warn;

    # ------------------------------------------------------------------------
    # PARA ONDE OS SPANS VAO
    #
    # OTLP sobre gRPC, porta 4317. O envio e em lote e assincrono - nao entra
    # no caminho da resposta ao cliente, entao o tracing nao adiciona latencia
    # perceptivel.
    #
    # `interval` e o teto de tempo que um span espera antes de ser enviado. Em
    # producao, 5s e razoavel; aqui esta baixo para o exemplo dar retorno
    # rapido.
    #
    # Consequencia pratica ao testar: um trace consultado imediatamente apos a
    # requisicao pode nao existir ainda. Nao e erro de configuracao - e o lote
    # que ainda nao partiu. Espere o `interval` antes de concluir que algo
    # quebrou.
    # ------------------------------------------------------------------------
    otel_exporter {
        endpoint    jaeger:4317;
        interval    2s;
        batch_size  512;
        batch_count 4;
    }

    # Nome que aparece no Jaeger. Se todos os servicos se chamarem "nginx", o
    # trace fica ilegivel - vale nomear por papel.
    otel_service_name nginx-borda;

    # ------------------------------------------------------------------------
    # AMOSTRAGEM
    #
    # Em producao, rastrear 100% do trafego custa caro em rede e em
    # armazenamento. O padrao e amostrar uma fracao.
    #
    # `otel_trace $variavel` aceita uma variavel, entao `split_clients` (o mesmo
    # do exemplo 15) vira um amostrador de N%.
    # ------------------------------------------------------------------------
    split_clients "$request_id" $amostra_10pct {
        10%     on;
        *       off;
    }

    # `propagate` = extrai o traceparent que chegou e repassa adiante. E o que
    # mantem a arvore conectada quando a requisicao ja vem de outro servico.
    # As alternativas: `extract` (so le), `inject` (so escreve), `ignore`.
    otel_trace_context propagate;

    upstream backend {
        server app:3000;
        keepalive 16;
    }

    server {
        listen 80;
        server_name localhost;

        # ====================================================================
        # 1. TUDO RASTREADO
        # ====================================================================
        location /pedidos {
            otel_trace on;

            # Sem isto, todos os spans se chamam "location /pedidos" e o Jaeger
            # fica cheio de spans com o mesmo nome. Com o metodo e a URI, da
            # para procurar por rota.
            otel_span_name "$request_method $uri";

            # Atributos do NEGOCIO sao o que torna o trace pesquisavel depois:
            # "me mostre os traces lentos do tenant X".
            otel_span_attr http.tenant   $http_x_tenant;
            otel_span_attr http.rota     $uri;
            otel_span_attr nginx.upstream $upstream_addr;

            proxy_pass http://backend;
            include /etc/nginx/snippets/proxy.conf;
        }

        # ====================================================================
        # 2. AMOSTRAGEM DE 10%
        #
        # Mesma aplicacao, mas so uma em cada dez requisicoes vira trace.
        # ====================================================================
        location /catalogo {
            otel_trace $amostra_10pct;
            otel_span_name "$request_method $uri";

            proxy_pass http://backend;
            include /etc/nginx/snippets/proxy.conf;
        }

        # ====================================================================
        # 3. SEM TRACING - referencia
        # ====================================================================
        location /saude {
            otel_trace off;
            access_log off;
            return 200 "ok\n";
        }

        # Mostra o trace da propria requisicao, para copiar e colar no Jaeger.
        location = /_trace {
            otel_trace on;
            default_type text/plain;
            return 200 "trace_id: $otel_trace_id\nspan_id : $otel_span_id\nabra:     http://localhost:16686/trace/$otel_trace_id\n";
        }
    }
}

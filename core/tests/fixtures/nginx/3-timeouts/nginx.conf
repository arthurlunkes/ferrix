##############################################################################
# TIMEOUTS
#
# Timeout existe para o servidor conseguir DESISTIR. Sem eles, uma conexao
# travada segura um worker, um socket e memoria por tempo indefinido - e
# derrubar um servico assim e mais facil do que parece.
#
# Os timeouts se dividem em dois grupos, e confundi-los e o erro comum:
#
#   CLIENTE  -> quanto o NGINX espera por quem esta do lado de fora
#               (client_header_timeout, client_body_timeout, send_timeout,
#                keepalive_timeout)
#
#   UPSTREAM -> quanto o NGINX espera pelo backend
#               (proxy_connect_timeout, proxy_send_timeout, proxy_read_timeout)
#
#
# >>> ATENCAO AO CONTEXTO DE CADA DIRETIVA <<<
#
# `client_header_timeout` e `client_body_timeout` valem em `http` e `server`,
# mas NAO em `location` - e faz sentido: quando o NGINX le os headers, ele
# ainda nao decidiu qual location vai atender.
#
# Colocar `client_header_timeout` dentro de um location nao gera aviso: o NGINX
# se RECUSA a subir, com "directive is not allowed here".
##############################################################################

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format tempos '"$request" status=$status rt=$request_time '
                      'urt=$upstream_response_time';
    access_log /var/log/nginx/access.log tempos;
    error_log  /var/log/nginx/error.log warn;

    upstream backend {
        server app:3000;
    }

    server {
        listen 80;
        server_name localhost;

        # ====================================================================
        # TIMEOUTS DO CLIENTE  (contexto server - nao cabem em location)
        # ====================================================================

        # Tempo para o cliente terminar de enviar os HEADERS. E a defesa contra
        # slowloris: o atacante abre conexoes e manda um byte de header por vez,
        # segurando workers sem nunca completar a requisicao.
        client_header_timeout 10s;

        # Tempo entre duas leituras do CORPO (upload). Nao e o tempo total: um
        # upload longo mas continuo nao estoura este limite.
        client_body_timeout 10s;

        # Tempo entre duas escritas PARA o cliente. Protege contra o cliente que
        # abre o download e nao le - prendendo a resposta na memoria do servidor.
        send_timeout 10s;

        # Quanto uma conexao ociosa fica aberta esperando a proxima requisicao.
        # Muito baixo desperdica handshakes; muito alto acumula conexoes ociosas.
        keepalive_timeout 15s;

        # ====================================================================
        # 1. RESPOSTA IMEDIATA - nenhum timeout entra em acao
        # ====================================================================
        location = /rapido {
            proxy_pass http://backend/;
            include /etc/nginx/snippets/proxy.conf;
        }

        # ====================================================================
        # 2. TIMEOUT DE LEITURA DO UPSTREAM
        #
        # proxy_read_timeout e o tempo entre duas LEITURAS do backend - nao o
        # tempo total da resposta. Um backend que envia dados devagar mas sem
        # parar nunca estoura este limite; um que fica calado por mais de 3s,
        # sim.
        #
        # Estourou -> 504 Gateway Timeout.
        #
        #   curl "localhost:8080/curto?ms=1000"   -> 200
        #   curl "localhost:8080/curto?ms=8000"   -> 504 em ~3s
        # ====================================================================
        location = /curto {
            proxy_read_timeout 3s;
            proxy_pass http://backend/lento$is_args$args;
            include /etc/nginx/snippets/proxy.conf;
        }

        # ====================================================================
        # 3. O MESMO PEDIDO, COM PACIENCIA
        #
        # Mesma requisicao, mesmo backend - so muda o limite. Serve para
        # comparar e para lembrar que timeout e uma escolha, nao uma constante.
        # ====================================================================
        location = /longo {
            proxy_read_timeout 30s;
            proxy_pass http://backend/lento$is_args$args;
            include /etc/nginx/snippets/proxy.conf;
        }

        # ====================================================================
        # 4. RESPOSTA QUE GOTEJA
        #
        # O backend manda um pedaco por segundo durante 30s. Com
        # proxy_read_timeout de 3s a resposta NAO e cortada: nunca se passam 3s
        # entre dois pedacos. E a prova de que o limite e por intervalo, nao
        # por duracao total.
        # ====================================================================
        location = /gotejando {
            proxy_read_timeout 3s;
            proxy_buffering off;          # entrega cada pedaco assim que chega
            proxy_pass http://backend/gotejando;
            include /etc/nginx/snippets/proxy.conf;
        }

        # ====================================================================
        # 5. TIMEOUT DE CONEXAO
        #
        # proxy_connect_timeout e so o aperto de mao TCP com o backend. Nao pode
        # passar de 75s, e valores altos aqui raramente ajudam: se o backend nao
        # aceitou a conexao em poucos segundos, ele esta fora do ar ou saturado.
        # ====================================================================
        location = /inalcancavel {
            proxy_connect_timeout 2s;
            # 203.0.113.1 e um endereco reservado para documentacao (RFC 5737):
            # nao responde, entao a conexao expira.
            proxy_pass http://203.0.113.1:3000/;
            include /etc/nginx/snippets/proxy.conf;
        }

        location = / {
            default_type text/plain;
            return 200 "timeouts\n  /rapido                resposta imediata\n  /curto?ms=8000         estoura proxy_read_timeout (504)\n  /longo?ms=8000         mesma coisa, com 30s de paciencia (200)\n  /gotejando             resposta lenta mas continua (200)\n  /inalcancavel          estoura proxy_connect_timeout (504)\n";
        }
    }
}

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Redirecionar HTTP para HTTPS
    server {
        listen 80;
        server_name localhost;
        return 301 https://$host$request_uri;
    }

    # Servidor HTTPS com TLS 1.3 e HTTP/2
    server {
        # A forma antiga era `listen 443 ssl http2;`. Desde o NGINX 1.25 ela e
        # DEPRECADA e imprime um aviso a cada start e a cada reload:
        #   "the listen ... http2 directive is deprecated, use the http2
        #    directive instead"
        # O HTTP/2 deixou de ser propriedade do socket e virou diretiva
        # propria, valida em http{} e server{}.
        listen 443 ssl;
        http2 on;

        server_name localhost;

        # Certificados SSL
        ssl_certificate /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        # Protocolos SSL - apenas TLS 1.2 e 1.3
        ssl_protocols TLSv1.2 TLSv1.3;
        
        # Ciphers recomendados para segurança
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers off;

        # Configurações de sessão SSL
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;

        # OCSP Stapling - DESLIGADO de proposito neste exemplo.
        #
        # O stapling faz o servidor buscar, ele mesmo, a prova de que seu
        # certificado nao foi revogado, e entrega-la junto no handshake. Isso
        # poupa o navegador de consultar a autoridade certificadora.
        #
        # So que ele depende de um EMISSOR real para consultar - e um
        # certificado auto-assinado nao tem emissor. Deixar ligado aqui nao
        # habilita nada: o NGINX apenas avisa a cada start
        #   "ssl_stapling ignored, issuer certificate not found"
        # e segue sem stapling.
        #
        # Em producao, com certificado de uma CA de verdade, descomente as tres
        # linhas (a `ssl_trusted_certificate` aponta para a cadeia da CA):
        #
        # ssl_stapling on;
        # ssl_stapling_verify on;
        # ssl_trusted_certificate /etc/nginx/certs/cadeia.pem;

        # Headers de segurança
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        location / {
            root /usr/share/nginx/html;
            index index.html;
        }

        # Endpoint para verificar protocolo
        location /info {
            add_header Content-Type text/plain;
            return 200 "Protocol: $server_protocol\nTLS Version: $ssl_protocol\nCipher: $ssl_cipher\n";
        }
    }
}

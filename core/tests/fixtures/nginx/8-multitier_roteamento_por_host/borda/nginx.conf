##############################################################################
# NGINX DE BORDA
#
# Unico ponto de entrada. Termina TLS (escolhendo o certificado por SNI) e
# roteia por Host para a maquina de cada empresa. Nao conhece as aplicacoes:
# so sabe entregar para o tier certo.
##############################################################################

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # O log mostra a decisao de roteamento: qual Host chegou, qual server_name
    # casou e para qual tier foi. E a forma mais rapida de depurar precedencia.
    log_format borda '$remote_addr host=$host sni="$ssl_server_name" '
                     'server_name="$server_name" -> upstream=$upstream_addr '
                     'status=$status xff="$proxy_add_x_forwarded_for"';

    access_log /var/log/nginx/access.log borda;
    error_log  /var/log/nginx/error.log warn;

    # ------------------------------------------------------------------------
    # TLS comum a todos os server{}. Cada server declara apenas o SEU par de
    # certificados; o resto e herdado daqui (evita repetir e evita declarar a
    # mesma shared zone varias vezes).
    # ------------------------------------------------------------------------
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ------------------------------------------------------------------------
    # WebSocket: traduz o header Upgrade em um valor de Connection.
    #
    # O valor VAZIO (e nao "close") quando nao ha upgrade e proposital: assim o
    # NGINX remove o header Connection e o keepalive com o upstream continua
    # valendo para o trafego HTTP normal.
    # ------------------------------------------------------------------------
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # ------------------------------------------------------------------------
    # Extrai o municipio de <municipio>.impressao.orionsistemas.com.
    # A borda repassa o resultado no header X-Municipio; quem transforma isso
    # em porta e o tier de impressao.
    # ------------------------------------------------------------------------
    map $host $municipio {
        default "";
        ~^(?<m>[a-z0-9-]+)\.impressao\.orionsistemas\.com$   $m;
    }

    # ------------------------------------------------------------------------
    # Um upstream por maquina. Como sao nomes fixos, o NGINX resolve no boot -
    # nao precisa de `resolver` aqui (compare com o tier de impressao, que usa
    # variavel no proxy_pass e por isso precisa).
    # ------------------------------------------------------------------------
    upstream tier_nimbus    { server nimbus-lb:80;    keepalive 16; }
    upstream tier_orion     { server orion-lb:80;     keepalive 16; }
    upstream tier_vertex    { server vertex-lb:80;    keepalive 16; }
    upstream tier_impressao { server impressao-lb:80; keepalive 16; }

    # ========================================================================
    # CATCH-ALL - fecha a porta para qualquer Host desconhecido.
    #
    # Sem isto, a borda responderia a QUALQUER dominio apontado para este IP,
    # virando um proxy aberto. O 444 e um codigo interno do NGINX: fecha a
    # conexao sem enviar resposta nenhuma.
    # ========================================================================
    server {
        listen 80  default_server;
        listen 443 ssl default_server;
        server_name _;

        # Precisa de algum certificado para o handshake TLS acontecer antes de
        # o NGINX poder recusar. Este e um cert descartavel, de nome invalido.
        ssl_certificate     /etc/nginx/certs/default.crt;
        ssl_certificate_key /etc/nginx/certs/default.key;

        return 444;
    }

    # ========================================================================
    # HTTP -> HTTPS para os dominios conhecidos
    # `.nimbus.com` e atalho para "nimbus.com e *.nimbus.com".
    # ========================================================================
    server {
        listen 80;
        server_name .nimbus.com .orionsistemas.com .vertexdata.com;
        return 301 https://$host$request_uri;
    }

    # ========================================================================
    # EMPRESA A - Nimbus
    # ========================================================================
    server {
        listen 443 ssl;
        http2 on;
        server_name nimbus.com *.nimbus.com;

        ssl_certificate     /etc/nginx/certs/nimbus.crt;
        ssl_certificate_key /etc/nginx/certs/nimbus.key;

        location / {
            include /etc/nginx/snippets/proxy-tier.conf;
            proxy_pass http://tier_nimbus;
        }
    }

    # ========================================================================
    # IMPRESSAO (DevExpress) - uma app por porta, uma porta por municipio
    #
    # >>> A PEGADINHA CENTRAL DESTE EXEMPLO <<<
    #
    # No NGINX, `*.orionsistemas.com` casa MULTIPLOS niveis - inclusive
    # `saopaulo.impressao.orionsistemas.com`. E a precedencia de server_name e:
    #
    #   1. nome exato
    #   2. wildcard inicial MAIS LONGO   <-- e aqui que este bloco vence
    #   3. wildcard final
    #   4. primeira regex que casar
    #
    # Ou seja: a ordem no arquivo NAO importa, e uma regex aqui NUNCA seria
    # alcancada, porque o wildcard generico do bloco de baixo ganharia antes.
    # A solucao e usar o wildcard mais longo e extrair o municipio via `map`.
    # ========================================================================
    server {
        listen 443 ssl;
        http2 on;
        server_name *.impressao.orionsistemas.com;

        # Certificado SEPARADO, e nao por capricho: wildcard de certificado TLS
        # cobre apenas UM nivel, entao `*.orionsistemas.com` NAO vale para
        # `saopaulo.impressao.orionsistemas.com`. Mesma sintaxe do server_name,
        # semantica oposta - vale conferir com:
        #   openssl x509 -in certs/orion-impressao.crt -noout -text | grep DNS
        ssl_certificate     /etc/nginx/certs/orion-impressao.crt;
        ssl_certificate_key /etc/nginx/certs/orion-impressao.key;

        location / {
            include /etc/nginx/snippets/proxy-tier.conf;
            proxy_set_header X-Municipio $municipio;
            proxy_pass http://tier_impressao;
        }
    }

    # ========================================================================
    # EMPRESA B - Orion Sistemas
    # ========================================================================
    server {
        listen 443 ssl;
        http2 on;
        server_name orionsistemas.com *.orionsistemas.com;

        ssl_certificate     /etc/nginx/certs/orion.crt;
        ssl_certificate_key /etc/nginx/certs/orion.key;

        location / {
            include /etc/nginx/snippets/proxy-tier.conf;
            proxy_pass http://tier_orion;
        }
    }

    # ========================================================================
    # EMPRESA C - Vertex Data
    # ========================================================================
    server {
        listen 443 ssl;
        http2 on;
        server_name vertexdata.com *.vertexdata.com;

        ssl_certificate     /etc/nginx/certs/vertex.crt;
        ssl_certificate_key /etc/nginx/certs/vertex.key;

        location / {
            include /etc/nginx/snippets/proxy-tier.conf;
            proxy_pass http://tier_vertex;
        }
    }
}

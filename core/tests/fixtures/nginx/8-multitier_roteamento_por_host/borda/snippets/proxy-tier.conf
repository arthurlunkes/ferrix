# Headers que a BORDA repassa para o tier da empresa.
# Incluido por todos os location{} da borda para nao repetir o bloco.

proxy_http_version 1.1;

# Preserva o Host original. Sem isto o tier receberia "tier_nimbus" e nao
# conseguiria escolher entre frontend / api / websocket.
proxy_set_header Host              $host;

# Primeiro elo da cadeia de IPs. $proxy_add_x_forwarded_for anexa o
# $remote_addr atual ao X-Forwarded-For que ja tenha chegado.
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

# O tier fala HTTP puro, entao so ele saberia dizer que o cliente veio por
# HTTPS se a borda contar.
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Tier            borda;

# WebSocket: se faltar em QUALQUER um dos dois NGINX, o upgrade falha.
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;

# Timeouts da borda. Ficam mais FOLGADOS que os do tier de proposito: quem
# deve desistir primeiro e quem esta mais perto da aplicacao, para o erro
# nascer com contexto em vez de virar um 504 generico na borda.
proxy_connect_timeout 5s;
proxy_send_timeout    75s;
proxy_read_timeout    75s;

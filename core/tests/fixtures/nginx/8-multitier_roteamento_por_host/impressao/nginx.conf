##############################################################################
# TIER DE IMPRESSAO  (maquina impressao-lb)
#
# Roda o DevExpress: UMA aplicacao por porta, uma porta por municipio cliente.
# A borda ja extraiu o municipio do subdominio e mandou em X-Municipio; aqui
# o trabalho e traduzir municipio -> porta e entregar.
##############################################################################

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format impressao '$remote_addr municipio=$http_x_municipio '
                         'porta=$porta_devexpress -> $upstream_addr '
                         'status=$status';

    access_log /var/log/nginx/access.log impressao;
    error_log  /var/log/nginx/error.log warn;

    set_real_ip_from  172.28.0.10;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    # ------------------------------------------------------------------------
    # >>> A SEGUNDA PEGADINHA DESTE EXEMPLO <<<
    #
    # O proxy_pass abaixo usa uma VARIAVEL. Isso muda o comportamento do NGINX:
    # em vez de resolver o nome uma vez no boot, ele passa a resolver a cada
    # request - e ai exige um `resolver` configurado. 127.0.0.11 e o DNS
    # interno do Docker.
    #
    # Sem esta linha o container SOBE NORMALMENTE e o nginx -t passa; o erro so
    # aparece em runtime, como 502 em todo request, com
    # "no resolver defined to resolve devexpress" no error.log.
    #
    # Para ver acontecer: comente a linha, `docker compose restart impressao-lb`
    # e repita o curl.
    # ------------------------------------------------------------------------
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ------------------------------------------------------------------------
    # Cadastro de municipios. Adicionar um cliente novo e uma linha aqui mais
    # uma porta nova no DevExpress - sem tocar na borda.
    #
    # Precisa bater com o mapa de portas em devexpress/index.js.
    # ------------------------------------------------------------------------
    map $http_x_municipio $porta_devexpress {
        default   "";
        saopaulo  8101;
        campinas  8102;
        santos    8103;
    }

    server {
        listen 80 default_server;
        server_name _;

        location / {
            # `if` dentro de location e mal visto no NGINX, mas `return` dentro
            # de `if` e um dos dois usos oficialmente seguros.
            if ($porta_devexpress = "") {
                return 404 "municipio desconhecido: '$http_x_municipio'\n";
            }

            proxy_http_version 1.1;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Municipio     $http_x_municipio;
            proxy_set_header X-Tier          "$http_x_tier,$hostname";

            # A variavel precisa ser montada com `set` antes: o NGINX nao aceita
            # interpolar a porta direto na diretiva.
            set $backend "http://devexpress:$porta_devexpress";
            proxy_pass $backend;

            proxy_connect_timeout 3s;
            proxy_read_timeout    60s;
        }

        # Util para conferir o que a borda mandou sem envolver o DevExpress.
        location = /_debug {
            default_type text/plain;
            return 200 "municipio=$http_x_municipio porta=$porta_devexpress host=$host tier=$http_x_tier\n";
        }
    }
}

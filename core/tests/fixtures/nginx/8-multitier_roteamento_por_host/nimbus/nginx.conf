##############################################################################
# TIER DA EMPRESA A - Nimbus  (maquina nimbus-lb)
#
# Recebe tudo que a borda mandou para *.nimbus.com e decide, agora por
# SUBDOMINIO, entre as tres coisas que a maquina hospeda:
#
#   nimbus.com      -> frontend estatico, servido pelo proprio NGINX
#   api.nimbus.com  -> aplicacao Node
#   ws.nimbus.com   -> mesma aplicacao, mas via WebSocket
#
# Os tres tiers de empresa sao identicos a menos dos nomes - compare com
# orion/nginx.conf e vertex/nginx.conf.
##############################################################################

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format tier '$remote_addr (cliente real) host=$host '
                    '-> upstream=$upstream_addr status=$status '
                    'xff="$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log tier;
    error_log  /var/log/nginx/error.log warn;

    # ------------------------------------------------------------------------
    # Recuperacao do IP real do cliente.
    #
    # Sem isto, $remote_addr aqui seria sempre o IP da borda e todo log/limite
    # por IP ficaria inutil. Confiamos APENAS no IP fixo da borda - confiar na
    # subnet /16 inteira deixaria qualquer container forjar X-Forwarded-For.
    # ------------------------------------------------------------------------
    set_real_ip_from  172.28.0.10;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # Timeouts padrao do tier. Mais curtos que os da borda de proposito: quem
    # esta perto da aplicacao desiste primeiro, para o erro nascer aqui com
    # contexto em vez de virar um 504 generico la na frente.
    #
    # Ficam no http{} para que o location /ws consiga SOBRESCREVER. Se
    # estivessem no snippet incluido dentro da location, redeclarar seria
    # "directive is duplicate" e o NGINX nem subiria.
    proxy_connect_timeout 3s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    upstream nimbus_app {
        server nimbus-app:3000;
        keepalive 16;
    }

    # ========================================================================
    # FRONTEND - arquivos estaticos servidos pelo proprio NGINX do tier.
    #
    # E tambem o default_server: qualquer subdominio de *.nimbus.com que a
    # borda mandar e que nao seja api/ws cai aqui, em vez de dar erro.
    # ========================================================================
    server {
        listen 80 default_server;
        server_name nimbus.com www.nimbus.com;

        root /usr/share/nginx/html;

        location / {
            # Padrao SPA: se o arquivo nao existe, entrega o index.html e
            # deixa o roteador do frontend resolver - sem isto, dar F5 numa
            # rota interna da 404.
            try_files $uri $uri/ /index.html;
        }

        # A mesma aplicacao, agora sob o dominio do frontend. Nao e redundancia
        # com api.nimbus.com: sem uma rota same-origin, o fetch da pagina para
        # api.nimbus.com seria bloqueado por CORS. A barra final no proxy_pass
        # remove o prefixo /api antes de repassar.
        location /api/ {
            include /etc/nginx/snippets/proxy-app.conf;
            proxy_pass http://nimbus_app/;
        }

        location /ws {
            include /etc/nginx/snippets/proxy-app.conf;
            proxy_pass http://nimbus_app;

            proxy_send_timeout 7d;
            proxy_read_timeout 7d;
        }
    }

    # ========================================================================
    # API
    # ========================================================================
    server {
        listen 80;
        server_name api.nimbus.com;

        location / {
            include /etc/nginx/snippets/proxy-app.conf;
            proxy_pass http://nimbus_app;
        }
    }

    # ========================================================================
    # WEBSOCKET
    #
    # Os headers Upgrade/Connection vem do snippet, mas os timeouts precisam
    # ser sobrescritos aqui: uma conexao WebSocket fica ociosa por minutos e
    # os 60s do snippet a derrubariam.
    # ========================================================================
    server {
        listen 80;
        server_name ws.nimbus.com;

        location / {
            include /etc/nginx/snippets/proxy-app.conf;
            proxy_pass http://nimbus_app;

            proxy_send_timeout 7d;
            proxy_read_timeout 7d;
        }
    }
}

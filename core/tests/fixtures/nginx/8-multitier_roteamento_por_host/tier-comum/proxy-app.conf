# Headers que o TIER DA EMPRESA repassa para a aplicacao.
# Este mesmo arquivo e montado nos tres tiers - o que diferencia cada um e
# $hostname, uma variavel nativa do NGINX com o hostname do container.

proxy_http_version 1.1;

proxy_set_header Host            $host;

# Neste ponto $remote_addr JA foi reescrito pelo modulo real_ip para o IP do
# cliente final (ver set_real_ip_from no nginx.conf do tier).
proxy_set_header X-Real-IP       $remote_addr;

# ...e e exatamente por isso que aqui NAO se usa $proxy_add_x_forwarded_for.
# Essa variavel anexa o $remote_addr atual ao X-Forwarded-For recebido - mas o
# real_ip ja trocou o $remote_addr pelo IP do cliente, entao o resultado seria
# o mesmo IP repetido:  "203.0.113.9, 203.0.113.9".
#
# Como a borda ja montou a cadeia, o tier so repassa. Use
# $proxy_add_x_forwarded_for apenas onde real_ip NAO esta ativo (na borda).
proxy_set_header X-Forwarded-For $http_x_forwarded_for;

# O tier fala HTTP, entao repassa adiante o protocolo que a BORDA informou -
# se usasse $scheme aqui, a aplicacao acharia que o cliente veio por HTTP.
proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

# Acumula o caminho percorrido em vez de sobrescrever: a app recebe
# "borda,nimbus-lb" e a cadeia de dois saltos fica visivel no /debug.
proxy_set_header X-Tier "$http_x_tier,$hostname";

proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;

# Os timeouts NAO ficam aqui, e a razao vale a pena registrar: proxy_set_header
# e aditivo, mas proxy_read_timeout nao - declarar duas vezes no MESMO contexto
# e erro fatal ("directive is duplicate"). Como o location /ws precisa de
# timeouts proprios, os defaults moram no bloco http{} do tier, onde a location
# consegue sobrescrever em vez de duplicar.


##############################################################################
# LOAD BALANCING MULTI-TENANT - modelo hibrido
#
# Tenant grande ganha um pool dedicado (silo); tenant pequeno divide um pool
# compartilhado. Uma linha no `map` promove um tenant de um modelo para o
# outro, sem mexer em mais nada.
#
# O tenant e identificado de DUAS formas, com papeis diferentes:
#   - subdominio ($tenant_host): barato, disponivel no inicio do request
#   - claim do JWT ($tenant_jwt): autoritativo, mas so existe depois do auth
# A diferenca entre os dois momentos e o que este exemplo ensina.
##############################################################################

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format multitenant '$remote_addr host=$host '
                           'tenant_host=$tenant_host tenant_jwt=$tenant_jwt '
                           'pool=$pool -> $upstream_addr status=$status';

    access_log /var/log/nginx/access.log multitenant;
    error_log  /var/log/nginx/error.log warn;

    # ------------------------------------------------------------------------
    # Tenant pelo subdominio: <tenant>.nuvemsaas.com
    # Disponivel desde o primeiro byte do request.
    # ------------------------------------------------------------------------
    map $host $tenant_host {
        default "";
        ~^(?<t>[a-z0-9-]+)\.nuvemsaas\.com$   $t;
    }

    # ------------------------------------------------------------------------
    # O CADASTRO DE TENANTS.
    #
    # Note que a chave e $tenant_jwt (o claim), nao o subdominio: quem decide
    # para onde o trafego vai e o token verificado, nao o texto do Host.
    #
    # `default` manda todo tenant nao listado para o pool compartilhado - e
    # assim que um cliente novo entra sem precisar de deploy. Promover um
    # tenant para silo e acrescentar uma linha aqui.
    # ------------------------------------------------------------------------
    map $tenant_jwt $pool {
        default   pool_compartilhado;
        ""        "";                 # sem tenant valido: nao deveria chegar aqui
        acme      pool_acme;
        globex    pool_globex;
    }

    # ------------------------------------------------------------------------
    # SILOS - poucas replicas, carga previsivel, isolamento total.
    # least_conn manda para quem tem menos conexoes ativas: melhor que round
    # robin quando os requests tem duracoes diferentes entre si.
    # ------------------------------------------------------------------------
    upstream pool_acme {
        least_conn;
        server acme1:3000;
        server acme2:3000;
        keepalive 16;
    }

    upstream pool_globex {
        least_conn;
        server globex1:3000;
        keepalive 16;
    }

    # ------------------------------------------------------------------------
    # POOL COMPARTILHADO - muitos tenants pequenos dividindo as mesmas replicas.
    #
    # `hash $tenant_host consistent` da afinidade: o mesmo tenant cai sempre na
    # mesma replica, entao cache e conexoes de banco daquele tenant ficam
    # quentes. O `consistent` (hashing consistente, estilo ketama) e o detalhe
    # que importa: sem ele, tirar 1 de 3 replicas remapearia TODOS os tenants;
    # com ele, remapeia so os que estavam na replica que saiu.
    #
    # A chave e $tenant_host, e nao $tenant_jwt, porque a afinidade so precisa
    # ser estavel - nao precisa ser confiavel. Quem garante a seguranca e o
    # auth_request, que ja rejeitou o request antes de chegar aqui.
    # ------------------------------------------------------------------------
    upstream pool_compartilhado {
        hash $tenant_host consistent;
        server shared1:3000;
        server shared2:3000;
        server shared3:3000;
        keepalive 32;
    }

    # ------------------------------------------------------------------------
    # COTA POR TENANT - protege contra o "vizinho barulhento".
    #
    # >>> A PEGADINHA CENTRAL DESTE EXEMPLO <<<
    #
    # A chave e $tenant_host. Trocar por $tenant_jwt DESLIGA a protecao inteira,
    # sem erro, sem aviso, sem uma linha no log:
    #
    #   1. `limit_req` roda na fase PREACCESS; `auth_request` roda na fase
    #      ACCESS, depois. Quando a chave e calculada, $tenant_jwt esta vazio.
    #   2. E o NGINX simplesmente IGNORA limites cuja chave deu vazia
    #      (ngx_http_limit_req_handler: `if (key.len == 0) continue;`).
    #
    # Nao vira "uma cota global", que ja seria ruim: vira cota nenhuma. Medido:
    #
    #   chave $tenant_jwt  -> 100 requests, 100x 200, zero 429
    #   chave $tenant_host -> 100 requests,  22x 200,  78x 429
    #
    # Regra pratica: chave de limite tem que sair de algo que existe no inicio
    # do request ($host, $remote_addr, $http_*), nunca de auth_request_set.
    #
    # ARMADILHA NA HORA DE TESTAR: trocar a chave e dar `nginx -s reload` NAO
    # tem efeito. A zona de memoria compartilhada sobrevive ao reload com a
    # definicao antiga enquanto o nome e o tamanho nao mudarem. Para ver a
    # diferenca e preciso reiniciar de fato:
    #   docker compose up -d --force-recreate nginx-mt
    # ------------------------------------------------------------------------
    limit_req_zone  $tenant_host zone=cota_tenant:10m rate=10r/s;
    limit_conn_zone $tenant_host zone=conn_tenant:10m;
    limit_req_status  429;   # o padrao seria 503, que engana o cliente
    limit_conn_status 429;

    # ========================================================================
    # Host fora do padrao <tenant>.nuvemsaas.com
    # ========================================================================
    server {
        listen 80 default_server;
        server_name _;
        return 404 "host fora do padrao <tenant>.nuvemsaas.com\n";
    }

    server {
        listen 80;
        server_name ~^[a-z0-9-]+\.nuvemsaas\.com$;

        # --------------------------------------------------------------------
        # Toda requisicao passa antes pelo validador de JWT.
        # --------------------------------------------------------------------
        auth_request /_auth;

        # Captura o tenant que o authsvc devolveu no header da resposta.
        # A variavel so tem valor DEPOIS que a subrequisicao termina.
        auth_request_set $tenant_jwt $upstream_http_x_tenant_id;

        location = /_auth {
            internal;
            proxy_pass http://authsvc:4000/verify;

            # A subrequisicao nao precisa do corpo - so do header Authorization.
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";

            # O authsvc compara este Host com o claim para barrar replay entre
            # tenants. $host nao chegaria sozinho: a subrequisicao interna
            # levaria o Host do upstream (authsvc), nao o do cliente.
            proxy_set_header X-Original-Host $host;
        }

        location / {
            # Cota por tenant, antes de qualquer proxy.
            limit_req  zone=cota_tenant burst=20 nodelay;
            limit_conn conn_tenant 20;

            # ----------------------------------------------------------------
            # $pool depende de $tenant_jwt, que so existe depois do
            # auth_request. Funciona porque `map` e PREGUICOSO: o valor so e
            # calculado quando a variavel e lida - e aqui, na fase de conteudo,
            # o auth ja rodou.
            #
            # Como o valor casa com o nome de um upstream declarado, o NGINX usa
            # o bloco direto e nao precisa de `resolver`.
            #
            # >>> NAO adicione um `if ($pool = "")` aqui como protecao. <<<
            #
            # Parece defensivo, mas quebra TUDO, por dois motivos combinados:
            #   1. `if` roda na fase REWRITE, antes do auth_request - nesse
            #      momento $tenant_jwt ainda esta vazio;
            #   2. o NGINX CACHEIA o valor de uma variavel de `map` na primeira
            #      leitura. Ou seja, o `if` nao so leria vazio: ele fixaria
            #      $pool="" para o resto do request, e o proxy_pass abaixo
            #      receberia vazio tambem.
            #
            # Ler uma variavel cedo demais nao e so inutil - envenena o valor.
            # Se quiser validar, valide $tenant_host, que existe desde o inicio.
            # ----------------------------------------------------------------
            proxy_pass http://$pool;

            proxy_http_version 1.1;
            proxy_set_header Host            $host;
            proxy_set_header X-Tenant        $tenant_jwt;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection      "";

            proxy_connect_timeout 3s;
            proxy_read_timeout    30s;
        }

        # Mostra o tenant do subdominio, sem envolver as aplicacoes.
        #
        # Repare no que NAO esta aqui: $tenant_jwt e $pool. `return` tambem roda
        # na fase rewrite, entao os dois viriam vazios - e, pior, ficariam
        # cacheados assim. Para ver o tenant do JWT, use a resposta da propria
        # aplicacao, que recebe o header X-Tenant montado na fase de conteudo.
        location = /_debug {
            default_type text/plain;
            return 200 "tenant_host=$tenant_host\n";
        }
    }
}

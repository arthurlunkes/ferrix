services:
  # ----------------------------------------------------------------------------
  # Option 1: Ultra-lean Core only (~20MB)
  # Usage: docker compose up ferrix-core
  # ----------------------------------------------------------------------------
  ferrix-core:
    image: ghcr.io/arthurlunkes/ferrix:latest
    container_name: ferrix-core
    restart: unless-stopped
    ports:
      - "80:80"       # Reverse Proxy traffic
      - "8081:8081"   # Control Plane / Admin REST API
    volumes:
      - ./ferrix.yaml:/etc/ferrix/ferrix.yaml

  # ----------------------------------------------------------------------------
  # Option 2: Full, with the web dashboard (served by the same Ferrix process)
  # Usage: docker compose up ferrix-full
  # The first start creates ferrix.yaml in ./ferrix-data with a random admin token
  # (shown in `docker compose logs ferrix-full`).
  # ----------------------------------------------------------------------------
  ferrix-full:
    image: ghcr.io/arthurlunkes/ferrix:full
    container_name: ferrix-full
    restart: unless-stopped
    ports:
      - "80:80"       # Reverse Proxy traffic
      - "8080:8080"   # Admin REST API and web dashboard
    volumes:
      - ./ferrix-data:/etc/ferrix


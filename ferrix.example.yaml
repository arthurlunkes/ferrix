# Ferrix example configuration (used by the Docker "full" image on first start).
# Every option is described in https://arthurlunkes.github.io/ferrix (04. Configuration Guide).

# The dashboard needs metrics; they are off by default to keep Ferrix light.
metrics:
  enabled: true

admin:
  listen: 127.0.0.1:8081

http:
  listen: 0.0.0.0:8000
  worker_threads: 4

upstreams:
  default_backend:
    name: default_backend
    algorithm: round_robin
    targets:
      - url: http://127.0.0.1:3000
        weight: 1

vhosts:
  - id: default-site
    name: Default Web Service
    server_names: ["*"]
    listen_port: 8000
    routes:
      - id: root-route
        path_prefix: /
        target_type: proxy_upstream
        upstream_name: default_backend

## =============================================================================
## Ferrix configuration
##
## Every option Ferrix understands is listed below. Lines starting with `##` explain;
## lines starting with a single `#` are options you can switch on by removing the `#`.
## Values shown in commented options are the defaults unless the text says otherwise.
##
## Check the file:   ferrix test
## Apply changes:    ferrix reload   (or SIGHUP; listener/port changes need `ferrix restart`)
## Full guide:       https://arthurlunkes.github.io/ferrix (04. Configuration Guide)
## =============================================================================

## -----------------------------------------------------------------------------
## http: the proxy/web server itself
## -----------------------------------------------------------------------------
http:
  ## Address and port for plain HTTP. Ports below 1024 need root or
  ## CAP_NET_BIND_SERVICE (the systemd unit and the packages grant it).
  listen: 0.0.0.0:80

  ## HTTP versions served to clients: http1, http2, http3.
  ## http3 runs over QUIC (UDP) on every TLS port; open that UDP port too. It needs
  ## a Ferrix built with `--features http3` (the packages and images leave it out).
  protocols: [http1, http2]
  # protocols: [http1, http2, http3]

  ## Worker threads (nginx `worker_processes`). Default: one per CPU core.
  # worker_threads: 4
  ## Pin workers to cores: off, auto, or a list of core ids such as [0, 2, 4, 6].
  # worker_cpu_affinity: "off"
  ## Maximum client connections per worker (nginx `worker_connections`).
  # worker_connections: 4096
  ## Raise the open-files limit at startup (nginx `worker_rlimit_nofile`).
  # worker_rlimit_nofile: 65535

  ## `Server: ferrix/<version>` (true) or just `Server: ferrix` (false).
  # server_tokens: true
  ## "Welcome to Ferrix" page for requests no virtual host handles.
  # default_page: true
  ## Add X-Request-Id to the upstream request and to the response.
  # request_id: false

  ## Timeouts, in milliseconds.
  # client_header_timeout_ms: 60000
  # client_body_timeout_ms: 60000
  # keepalive_timeout_ms: 75000
  # proxy_connect_timeout_ms: 60000
  # proxy_read_timeout_ms: 60000
  # proxy_send_timeout_ms: 60000

  ## Largest request body accepted, in bytes (nginx `client_max_body_size`).
  # client_max_body_size: 1073741824
  ## Request bodies up to this size are buffered so a failed upstream can be retried.
  # proxy_request_buffer_size: 1048576

  ## Response compression (gzip always; br and zstd when built in).
  # compression:
  #   enabled: true
  #   level: default              ## fastest, default or best
  #   min_length: 1024            ## smaller responses are sent as-is
  #   algorithms: [zstd, br, gzip]
  #   types: [text/*, application/json, application/javascript, application/xml, image/svg+xml]

  ## Where route `cache:` entries live: memory (default), disk (nginx proxy_cache_path)
  ## or redis (Redis, Dragonfly, KeyDB, Valkey: anything speaking RESP).
  # cache_store:
  #   kind: memory                    ## memory, disk or redis
  #   path: /var/cache/ferrix         ## disk: directory, nginx levels=1:2 layout
  #   max_bytes: 0                    ## disk: oldest entries go first above this size; 0 = no limit
  #   url: redis://:password@127.0.0.1:6379/0   ## redis: user, password and db are optional
  #   prefix: "ferrix:cache:"         ## redis: key prefix

  ## In-memory cache for small static files.
  # static_cache:
  #   max_file_bytes: 1048576     ## 0 turns the cache off
  #   max_total_bytes: 67108864

  ## Access log file (nginx `log_format` + `access_log`): combined, or your own format.
  # access_log:
  #   path: /var/log/ferrix/access.log
  #   format: combined

  ## Content-Type for files whose extension is unknown and for `return` bodies
  ## (nginx `default_type`; Ferrix's default is text/plain).
  # default_type: application/octet-stream
  ## Extra or overriding extension -> MIME type pairs (nginx `types {}`).
  # mime_types:
  #   webmanifest: application/manifest+json

  ## Add X-Real-IP, X-Forwarded-For and X-Forwarded-Proto to every proxied request
  ## (Ferrix's behaviour before 0.3). Off = nginx behaviour: only `proxy_set_headers`.
  # proxy_forwarded_headers: false
  ## Follow X-Accel-Redirect from backends (nginx internal redirect). Off by default here:
  ## turning it on keeps a copy of each request's headers on hosts that may need it.
  # x_accel_redirect: false

  ## Request validation (nginx defaults). Ambiguous requests always get 400: two Host
  ## headers, HTTP/1.1 without Host, Content-Length with Transfer-Encoding.
  ## Keep request headers whose names contain "_" (dropped by default).
  # underscores_in_headers: false
  ## Skip malformed header lines instead of answering 400.
  # ignore_invalid_headers: true
  ## Longest request line or header line, in bytes (nginx `large_client_header_buffers`).
  # max_header_line_bytes: 8192
  ## Methods accepted at all; others get 405. Default: HTTP and WebDAV methods, no TRACE.
  # allowed_methods: [GET, HEAD, POST, PUT, DELETE, PATCH, OPTIONS, CONNECT, PROPFIND, PROPPATCH, MKCOL, COPY, MOVE, LOCK, UNLOCK, SEARCH, REPORT, MKCALENDAR]

  ## URL and redirect handling (nginx defaults).
  # merge_slashes: true
  # absolute_redirect: true
  # port_in_redirect: true
  # server_name_in_redirect: false

  ## Every connection starts with a PROXY protocol header (behind an AWS NLB or HAProxy).
  # proxy_protocol: false

  ## HTTP/2 and HTTP/3 limits; leave out for the defaults.
  # http2:
  #   max_concurrent_streams: 200
  #   max_header_list_size: 65536
  #   initial_stream_window: 1048576
  #   initial_connection_window: 2097152
  #   max_frame_size: 16384
  #   keepalive_interval_ms: 30000
  # http3:
  #   max_concurrent_streams: 100
  #   stream_buffer_size: 1048576
  #   idle_timeout_ms: 30000

  ## Country, city and ASN variables from MaxMind .mmdb databases ($geoip_country_code...).
  # geoip:
  #   country_db: /usr/share/GeoIP/GeoLite2-Country.mmdb
  #   city_db: /usr/share/GeoIP/GeoLite2-City.mmdb
  #   asn_db: /usr/share/GeoIP/GeoLite2-ASN.mmdb

  ## Variables (nginx map, geo, split_clients), usable in routes as $name.
  # variables:
  #   is_bot: { type: map, source: $http_user_agent, entries: [{ pattern: "~*bot", value: "1" }], default: "0" }
  #   network: { type: geo, ranges: [{ network: 10.0.0.0/8, value: lan }], default: wan }
  #   canary: { type: split_clients, source: $remote_addr, buckets: [{ percent: 10, value: v2 }, { percent: 0, value: v1 }] }
  #   user_id: { type: json, source: $request_body, path: user.id }

## -----------------------------------------------------------------------------
## admin: REST API and web dashboard
## -----------------------------------------------------------------------------
admin:
  # enabled: true
  listen: 127.0.0.1:8081
  auth:
    ## none (only allowed on 127.0.0.1), token or basic.
    mode: token
    token: "@ADMIN_TOKEN@"
    ## For mode: basic
    # username: admin
    # password: change-me
  ## Browser origins allowed to call the API.
  # cors_origins: [http://localhost:5173]
  ## Serve Prometheus /metrics without authentication.
  # metrics_public: false
  ## Folder with the built dashboard; served at the admin address.
  # dashboard_dir: /usr/share/ferrix/dashboard

## Request metrics and the live request log (dashboard, /metrics). Off by default
## because it costs a little per request.
# metrics:
#   enabled: true

## Real client address when Ferrix runs behind another proxy or load balancer.
# real_ip:
#   trusted_proxies: [10.0.0.0/8, 192.168.0.0/16]
#   header: x_forwarded_for     ## none, x_forwarded_for or x_real_ip
#   recursive: true

## Let's Encrypt account used by hosts with `tls: { acme: true }`.
# acme:
#   email: you@example.com
#   directory_url: https://acme-v02.api.letsencrypt.org/directory
#   storage_dir: ./acme
#   renew_before_days: 30

## -----------------------------------------------------------------------------
## upstreams: groups of backend servers the routes proxy to
## -----------------------------------------------------------------------------
upstreams:
  backend:
    name: backend
    ## round_robin, weighted_round_robin, least_conn, ip_hash, random or consistent_hash
    algorithm: round_robin
    targets:
      - url: http://127.0.0.1:3000
        # weight: 1
        # max_fails: 3                ## failures before the server is taken out...
        # fail_timeout_secs: 10       ## ...for this long
        # backup: false               ## only used when every other server is down
        # down: false                 ## take it out by hand
        # max_conns: 100
    ## Active health checks.
    # health_check:
    #   path: /health
    #   interval_secs: 10
    #   timeout_secs: 3
    #   expected_status: 200
    ## Check the certificate of https:// targets.
    # verify_tls: true
    ## Host header sent to this upstream. Default: the upstream's name (nginx $proxy_host).
    # host_header: api.internal
    ## Key for consistent_hash: $remote_addr, $request_uri, $uri, $host,
    ## $http_<header>, $cookie_<name> or $arg_<name>.
    # hash_key: $remote_addr
    ## Keep each client on the same server with a cookie.
    # sticky:
    #   cookie: srv_id
    #   path: /
    #   max_age_secs: 3600
    ## TLS towards https:// targets: client certificate, own CA, SNI name.
    # tls:
    #   client_cert: /etc/ferrix/certs/client.pem
    #   client_key: /etc/ferrix/certs/client.key
    #   trusted_ca: /etc/ferrix/certs/backend-ca.pem
    #   server_name: backend.internal

## -----------------------------------------------------------------------------
## vhosts: sites, like nginx `server {}` blocks
## -----------------------------------------------------------------------------
vhosts:
  - id: default
    name: Default site
    ## Host names this site answers to; "*" catches everything; "*.example.com" works.
    server_names: ["*"]
    ## Default: 80, or 443 when `tls` is set.
    # listen_port: 80

    ## HTTPS: certificate files, or `acme: true` for automatic Let's Encrypt.
    # tls:
    #   cert_path: /etc/ferrix/certs/example.com.crt
    #   key_path: /etc/ferrix/certs/example.com.key
    #   acme: false
    #   verify_client: off          ## off, on or optional (client certificates)
    #   client_ca: /etc/ferrix/certs/clients-ca.pem
    #   ocsp_file: /etc/ferrix/certs/example.com.ocsp

    ## Headers added to this site's successful and redirect responses.
    # headers:
    #   X-Content-Type-Options: nosniff
    ## Headers added to every response of this site, errors included.
    # headers_always:
    #   Strict-Transport-Security: max-age=31536000

    ## Access control (CIDRs allowed) and password protection.
    # allowed_ips: [192.168.0.0/16]
    # denied_ips: [192.168.1.13]
    ## password is plain text or a hash (bcrypt $2y$, $apr1$, {SHA}, {SSHA}, $5$, $6$).
    ## user_file is an htpasswd file (nginx `auth_basic_user_file`), reloaded when it changes.
    # basic_auth:
    #   username: admin
    #   password: change-me
    #   user_file: /etc/ferrix/htpasswd
    #   realm: Restricted
    # satisfy: all                  ## all: IP and password; any: either is enough

    ## Request rate and concurrent connections per client IP.
    # rate_limit:
    #   requests_per_second: 10
    #   burst: 20
    #   mode: no_delay              ## no_delay, queue or delay
    #   delay: 5                    ## for mode: delay
    #   status: 429
    #   retry_after: 1
    # limit_conn:
    #   max_connections: 20
    #   status: 429

    ## Custom error pages for errors Ferrix itself generates.
    # error_pages:
    #   "404": /var/www/errors/404.html
    #   5xx: /var/www/errors/50x.html
    ## Internal redirects on error (nginx `error_page 404 =200 @fallback`). target is a
    ## named route (@name), a URI served by this site, or an external URL (302).
    ## status: empty keeps the original code, "=" uses the target's, or a number.
    # error_redirects:
    #   - { codes: [404], target: "@fallback", status: "=" }
    # recursive_error_pages: false

    ## Rewrites and if-conditions that run before route matching.
    # rewrites:
    #   - { pattern: "^/old/(.*)$", replacement: "/new/$1", flag: permanent }   ## last, break, redirect, permanent
    # conditions:
    #   - { condition: "$is_bot", return_code: 403 }

    routes:
      ## With no route for "/", Ferrix shows its welcome page there.
      ## Reverse proxy: /api/users -> http://127.0.0.1:3000/users
      - id: api
        path_prefix: /api
        target_type: proxy_upstream
        upstream_name: backend
        strip_prefix: true
        ## prefix, prefix_literal, exact, prefix_priority, regex, regex_case_insensitive,
        ## or named (path_prefix "@name", nginx `location @name`).
        # match_type: prefix
        ## Only reachable through error_redirects, try_files or X-Accel-Redirect.
        # internal: false
        ## Per-route error redirects (override the site's).
        # error_redirects: []
        # websocket_enabled: true
        # access_log: true

        ## Headers sent to the upstream, like nginx `proxy_set_header`. As in nginx, only
        ## these are added: Host is the upstream name ($proxy_host) and the client's own
        ## headers pass through. An empty value removes a header. Variables: $host,
        ## $http_host, $proxy_host, $remote_addr, $proxy_add_x_forwarded_for, $scheme and
        ## any $variable from http.variables.
        # proxy_set_headers:
        #   Host: $host
        #   X-Real-IP: $remote_addr
        #   X-Forwarded-For: $proxy_add_x_forwarded_for
        #   X-Forwarded-Proto: $scheme
        ## Response headers from the upstream to drop / to keep although hidden by default
        ## (X-Accel-*, X-Pad). nginx `proxy_hide_header` / `proxy_pass_header`.
        # proxy_hide_headers: [X-Powered-By]
        # proxy_pass_headers: [X-Accel-Redirect]
        ## Change the method or the body sent upstream; skip the client's headers or body.
        # proxy_method: POST
        # proxy_set_body: "user=$arg_user"
        # proxy_pass_request_headers: true
        # proxy_pass_request_body: true
        ## Headers added to successful and redirect responses (200, 201, 204, 206, 3xx).
        # add_headers:
        #   Cache-Control: no-store
        ## Headers added to every response, errors included (nginx `add_header ... always`).
        # add_headers_always:
        #   X-Frame-Options: DENY

        ## Per-route timeouts (override the http ones).
        # proxy_connect_timeout_ms: 5000
        # proxy_read_timeout_ms: 30000
        # proxy_send_timeout_ms: 30000

        ## When to try the next server (nginx `proxy_next_upstream`).
        ## Conditions: error, timeout, http500, http502, http503, http504, http403, http404
        # proxy_next_upstream:
        #   conditions: [error, timeout, http502, http504]
        #   tries: 3
        #   timeout_ms: 10000

        ## Cache upstream responses (where: http.cache_store). Validity follows nginx:
        ## X-Accel-Expires, then Cache-Control max-age/s-maxage, then Expires, then
        ## valid_by_status (or valid_secs for 200, 301 and 302).
        # cache:
        #   valid_secs: 60
        #   valid_by_status: { "200": 600, "404": 30, any: 5 }
        #   key: "$scheme$host$request_uri"   ## nginx proxy_cache_key; default method+host+URI
        #   methods: [GET, HEAD]
        #   min_uses: 1                       ## store after this many requests for the key
        #   no_cache: ["$cookie_session"]     ## any non-empty, non-"0" value: do not store
        #   bypass: ["$arg_preview"]          ## any non-empty, non-"0" value: skip the cache
        #   max_body_bytes: 2097152
        #   ignore_headers: [Cache-Control, Expires, Set-Cookie, Vary, X-Accel-Expires]
        #   bypass_headers: [Authorization]
        #   bypass_cookies: [session]
        #   bypass_query_params: [nocache]
        #   use_stale: [error, timeout, updating, http_500, http_502, http_503, http_504]
        #   stale_keep_secs: 86400
        #   lock: true
        #   lock_timeout_ms: 5000
        #   revalidate: true
        #   background_update: true

        ## Compress this route even when http.compression is off (or the other way round).
        # compression: true

        ## CORS for browsers calling this route from another origin.
        # cors:
        #   allow_origins: ["https://app.example.com"]
        #   allow_methods: [GET, POST, PUT, DELETE]
        #   allow_headers: [Content-Type, Authorization]
        #   expose_headers: [X-Request-Id]
        #   allow_credentials: false
        #   max_age_secs: 600

        ## Route-level access control and limits (same fields as the vhost ones).
        # allowed_ips: [10.0.0.0/8]
        # denied_ips: []
        # rate_limit:
        #   requests_per_second: 5
        #   burst: 10

        ## nginx rewrite, if and set for this route.
        # rewrites:
        #   - { pattern: "^/v1/(.*)$", replacement: "/$1", flag: break }
        # conditions:
        #   - { condition: "$request_method = DELETE", return_code: 405 }
        #   - { condition: "$http_x_legacy", return_code: 302, return_value: "https://old.example.com$request_uri" }
        #   - { condition: "-f $request_filename", rewrite: { pattern: "^(.*)$", replacement: "/static$1", flag: last } }
        # set: [["$tier", "$network"]]

        ## Only these methods, unless the client IP is allowed.
        # limit_except:
        #   methods: [GET, POST]
        #   allow: [10.0.0.0/8]
        ## Bandwidth per response, after the first bytes.
        # limit_rate: 102400
        # limit_rate_after: 1048576
        ## Hotlink protection and signed, expiring links.
        # valid_referers: [none, blocked, server_names, "*.example.com"]
        # secure_link:
        #   md5: "$secure_link_expires$uri secret"
        #   hash_arg: md5
        #   expires_arg: expires

        ## Ask an auth service first; 2xx lets the request through.
        # auth_request:
        #   url: http://127.0.0.1:9000/auth
        #   set_headers: [X-User]
        #   timeout_ms: 2000
        ## Send a copy of each request elsewhere and ignore its response.
        # mirror: [http://127.0.0.1:8080]
        ## Rewrite Location headers and cookies coming from the upstream.
        # proxy_redirect: [[default, default]]
        # proxy_cookie_path: [[/app/, /]]
        # proxy_cookie_domain: [[backend.internal, example.com]]
        # proxy_cookie_flags: [["*", "secure httponly samesite=lax"]]
        ## Upstream errors (>= 400) use this vhost's error_pages.
        # proxy_intercept_errors: false
        ## Proxy gRPC over HTTP/2 to the upstream.
        # grpc: false
        ## CONNECT tunnels (forward proxy).
        # tunnel:
        #   allowed_ports: [443]
        #   allowed_hosts: ["*.example.com"]
        #   idle_timeout_ms: 600000

        ## Response filters.
        # sub_filter:
        #   replacements: [["http://old.example.com", "https://example.com"]]
        #   once: true
        #   types: [text/css]
        # add_before_body: /header.html
        # add_after_body: /footer.html
        # addition_types: [text/plain]
        # charset: utf-8
        # source_charset: windows-1251
        # override_charset: false
        # charset_types: [text/xml]
        # gunzip: false               ## decompress for clients without gzip
        # ssi: false
        # ssi_types: [text/shtml]
        # userid:
        #   name: uid
        #   domain: example.com
        #   path: /
        #   expires_secs: 31536000
        #   flags: "Secure HttpOnly"
        # image_filter:               ## needs a build with --features image-filter
        #   op: resize                ## resize, crop, rotate, size or test
        #   width: 300
        #   height: 0
        #   jpeg_quality: 80
        #   rotate: 90                ## for op: rotate (90, 180 or 270)
        #   buffer_bytes: 5242880     ## largest image read, in bytes

      ## Static files: serve a folder (like nginx `root` + `try_files`).
      # - id: site
      #   path_prefix: /
      #   target_type: static_files
      #   static_root: /var/www/html
      #   try_files: $uri $uri/ /index.html
      #   autoindex: false            ## list folders without an index.html
      #   random_index: false
      #   flv: false                  ## FLV pseudo-streaming (?start=)
      #   dav:                        ## WebDAV uploads
      #     methods: [PUT, DELETE, MKCOL, COPY, MOVE]
      #     create_full_put_path: true
      #     access: 0o644             ## permissions of created files

      ## Redirect: /old -> https://example.com/new
      # - id: old
      #   path_prefix: /old
      #   target_type: redirect
      #   redirect_url: https://example.com/new
      #   redirect_code: 301

      ## Fixed response (nginx `return 200 "ok"`).
      # - id: health
      #   path_prefix: /healthz
      #   match_type: exact
      #   target_type: return
      #   redirect_code: 200
      #   return_body: ok

      ## 1x1 transparent GIF (nginx empty_gif).
      # - id: pixel
      #   path_prefix: /pixel.gif
      #   target_type: return
      #   empty_gif: true

      ## PHP-FPM and other FastCGI, SCGI or uWSGI apps.
      # - id: php
      #   path_prefix: '\.php(/|$)'
      #   match_type: regex
      #   target_type: cgi
      #   static_root: /var/www/html
      #   cgi:
      #     protocol: fastcgi         ## fastcgi, scgi or uwsgi
      #     pass: "unix:/run/php/php8.3-fpm.sock"
      #     index: index.php
      #     root: /var/www/html         ## overrides static_root for SCRIPT_FILENAME
      #     params: { APP_ENV: production }

      ## Pages served from memcached.
      # - id: cached-pages
      #   path_prefix: /cached
      #   target_type: memcached
      #   memcached:
      #     pass: "127.0.0.1:11211"
      #     key: "$uri?$args"
      #     content_type: text/html
      #     gzip_flag: 2

## -----------------------------------------------------------------------------
## streams: TCP/UDP proxying (nginx `stream {}`), e.g. databases or DNS
## -----------------------------------------------------------------------------
# streams:
#   - id: postgres
#     listen: 0.0.0.0:5432
#     protocol: tcp               ## tcp or udp
#     upstream: backend           ## an upstream whose targets are host:port
#     connect_timeout_ms: 5000
#     idle_timeout_ms: 600000
#     accept_proxy_protocol: false
#     send_proxy_protocol: false
#     upload_rate: 0              ## bytes per second, 0 = unlimited
#     download_rate: 0
#     ## TLS towards the upstream.
#     upstream_tls:
#       verify: true
#       server_name: db.internal
#     ## Route by TLS SNI name to different upstreams (instead of `upstream`).
#     sni_routes: { api.example.com: backend, default: backend }
#     ## Or answer with fixed text and close (nginx `return` in a stream).
#     # return_text: "maintenance"
